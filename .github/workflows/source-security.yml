# Source security is independent of dependency and native-image vulnerability scans.
# No source-writing token, deployment secret or Azure identity is available here.
name: Source security
on:
  push:
    branches: [development, main, 'feat/sunset-v3-*']
  pull_request:
    branches: [development, main]
permissions:
  contents: read
concurrency:
  group: source-security-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  codeql:
    name: codeql-${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # Upload analysis, not repository contents or approvals.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the exact analyzed source
        run: |
          mkdir -p artifacts/codeql
          git rev-parse HEAD > artifacts/codeql/source-commit.txt
      - name: Initialize the pinned security-extended query suite
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # inspected v4
        with:
          tools: linked
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze and upload exact-head code scanning results
        id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          output: artifacts/codeql/sarif
          category: /language:${{ matrix.language }}
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.ref }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          upload: always
          upload-database: false
          wait-for-processing: true
      - name: Fail on reported source findings, not just scanner execution errors
        # A successful CodeQL upload alone does not mean the analysis has no alerts.
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: |
          python - <<'PY'
          """Require real SARIF output and report unsuppressed results as a failed gate."""
          import json
          from pathlib import Path

          root = Path('artifacts/codeql')
          files = sorted((root / 'sarif').glob('*.sarif'))
          if not files:
              raise SystemExit('No SARIF analysis was produced')
          findings = []
          analyses = []
          for path in files:
              document = json.loads(path.read_text())
              if document.get('version') != '2.1.0' or not document.get('runs'):
                  raise SystemExit('Invalid or empty SARIF analysis')
              for run in document['runs']:
                  driver = run.get('tool', {}).get('driver', {})
                  if driver.get('name') != 'CodeQL' or not isinstance(run.get('results'), list):
                      raise SystemExit('Unexpected analysis producer or missing result set')
                  if any(item.get('executionSuccessful') is False for item in run.get('invocations', [])):
                      raise SystemExit('The SARIF producer reported failed execution')
                  # No suppressed findings are silently dropped. Any exception must
                  # receive a specific review rather than being hidden by this parser.
                  findings.extend({'rule_id': item.get('ruleId'), 'level': item.get('level')} for item in run['results'])
                  analyses.append({'file': path.name, 'version': driver.get('version'), 'results': len(run['results'])})
          report = {'source_commit': (root / 'source-commit.txt').read_text().strip(),
                    'status': 'FAIL' if findings else 'PASS', 'analyses': analyses,
                    'findings': findings, 'limitations': 'The configured static query suite is not a proof of absence of vulnerabilities.'}
          (root / 'gate-summary.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          if findings:
              raise SystemExit('CodeQL findings require review before merge')
          PY
      - name: Preserve source analysis and gate results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/codeql/
          if-no-files-found: error
          retention-days: 60
  secrets:
    name: history-secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0 # Inspect reachable history, not only the latest source tree.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record source and verify the pinned scanner download
        run: |
          set -euo pipefail
          mkdir -p artifacts/secrets "$RUNNER_TEMP/matchdesk-gitleaks" "$RUNNER_TEMP/matchdesk-no-ignores"
          git rev-parse HEAD > artifacts/secrets/source-commit.txt
          git rev-list --all --count > artifacts/secrets/reachable-commits.txt
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/matchdesk-gitleaks/scanner.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  scanner.tar.gz' \
            | (cd "$RUNNER_TEMP/matchdesk-gitleaks" && sha256sum --check -)
          tar -xzf "$RUNNER_TEMP/matchdesk-gitleaks/scanner.tar.gz" -C "$RUNNER_TEMP/matchdesk-gitleaks" gitleaks
          "$RUNNER_TEMP/matchdesk-gitleaks/gitleaks" version > artifacts/secrets/scanner-version.txt
      - name: Retrieve the exact reviewed historical test fixture
        # PR #89 was integrated by squash; its introducing commit is no longer
        # reachable from branch heads but is still in refs/pull/89/head history.
        # Fetch only that history to prove the immutable fixture bytes below.
        # This does not alter scanner rules, exclusions or reviewed fingerprints.
        run: |
          set -euo pipefail
          reviewed=6f96c2cb7e6fb8e1bec378a9e137d7da32cc12c1
          if ! git cat-file -e "${reviewed}^{commit}" 2>/dev/null; then
            git fetch --no-tags --no-recurse-submodules origin refs/pull/89/head
          fi
          git cat-file -e "${reviewed}^{commit}"
          git cat-file -e "${reviewed}:apps/web/tests/workforce-bff.test.mjs"
      - name: Recompute the exact historical digest false positives before excluding them
        # Only 13 reviewed historical fingerprints qualify, never whole paths or rules.
        run: |
          python - <<'PY'
          """Prove each flagged historical value is its documented source-file SHA-256."""
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          records = json.loads(Path('docs/evidence/secret-scan-reviewed-digests-20261008.json').read_text())
          if len(records) != 13 or len({r['fingerprint'] for r in records}) != 13:
              raise SystemExit('Unexpected historical review scope')
          allowed_commits = {'964fb8c5caae8cb9fc0955c3bf12bd3768b28040', '211d3676e03b70304404558818de4e175b345ef3'}
          squash_commit = 'f62d8ccc2c02f36a707a6e24c6640c449048d941'
          fingerprints = []
          squash_aliases = []
          for record in records:
              commit, path, rule, number = record['fingerprint'].split(':')
              if commit not in allowed_commits or rule != 'generic-api-key':
                  raise SystemExit('Unreviewed secret-scan fingerprint')
              document = subprocess.check_output(['git', 'show', f'{commit}:{path}']).decode('utf-8')
              line = document.splitlines()[int(number) - 1]
              match = re.fullmatch(r'\s*"([^"]+)": "([0-9a-f]{64})",?', line)
              if not match or match[2] != record['sha256']:
                  raise SystemExit('Historical finding is not the reviewed digest field')
              target = record['digest_of']
              if match[1] != target and not (path == 'contracts/manifest.json' and 'contracts/' + match[1] == target):
                  raise SystemExit('Digest field refers to a different source file')
              # Formatting manifests describe a later reviewed blob, while original
              # manifests describe files at the immutable import commit itself.
              if 'git_blob' in record:
                  if not re.fullmatch(r'[0-9a-f]{40}', record['git_blob']):
                      raise SystemExit('Invalid source object identity')
                  data = subprocess.check_output(['git', 'cat-file', 'blob', record['git_blob']])
              else:
                  data = subprocess.check_output(['git', 'show', f'{commit}:{target}'])
              if hashlib.sha256(data).hexdigest() != record['sha256']:
                  raise SystemExit('Source bytes do not reproduce the reviewed digest')

              # PR #1 was squash-merged, so the same reviewed digest fields were
              # introduced once more at the new main commit. Derive only those exact
              # commit/path/rule/line aliases after proving the line is byte-for-byte
              # equivalent to the already reviewed digest field.
              squash_document = subprocess.check_output(['git', 'show', f'{squash_commit}:{path}']).decode('utf-8')
              squash_line = squash_document.splitlines()[int(number) - 1]
              squash_match = re.fullmatch(r'\s*"([^"]+)": "([0-9a-f]{64})",?', squash_line)
              if not squash_match or squash_match.groups() != match.groups():
                  raise SystemExit('Squash alias is not the reviewed digest field')
              alias = f'{squash_commit}:{path}:{rule}:{number}'
              fingerprints.extend([record['fingerprint'], alias])
              squash_aliases.append({'fingerprint': alias, 'derived_from': record['fingerprint'], 'sha256': record['sha256']})

          # Qualify the one newly surfaced OpenAPI schema digest against its exact
          # introducing commit. No future digest, nearby line or different rule is ignored.
          additional = json.loads(Path('docs/evidence/secret-scan-reviewed-digests-20261010.json').read_text())
          if len(additional) != 1:
              raise SystemExit('Unexpected new digest-review count')
          entry = additional[0]
          reviewed_commit = 'a96f6ffecb65df5b1b4bbb8785563897e83ae2fa'
          reviewed_path = 'contracts/manifest.json'
          reviewed_source = 'contracts/openapi.json'
          reviewed_fingerprint = f'{reviewed_commit}:{reviewed_path}:generic-api-key:13'
          if (entry.get('fingerprint') != reviewed_fingerprint
                  or entry.get('digest_of') != reviewed_source):
              raise SystemExit('New digest review identity changed')
          line = subprocess.check_output([
              'git', 'show', f'{reviewed_commit}:{reviewed_path}'
          ]).decode('utf-8').splitlines()[12]
          parsed = re.fullmatch(r'\s*"openapi\.json": "([0-9a-f]{64})",?', line)
          source = subprocess.check_output([
              'git', 'show', f'{reviewed_commit}:{reviewed_source}'
          ])
          actual_digest = hashlib.sha256(source).hexdigest()
          if (parsed is None or parsed[1] != entry.get('sha256')
                  or actual_digest != entry.get('sha256')):
              raise SystemExit('New OpenAPI finding is not the reviewed file digest')
          fingerprints.append(reviewed_fingerprint)

          # 17 Oct 2026: the contract snapshots gained MetricAssertion.decimals and an
          # optional MatchWindow.period, so the OpenAPI digest in the manifest changed.
          # Re-prove the one exact fingerprint the same way: the flagged line must be the
          # manifest's openapi.json field and equal SHA-256 of openapi.json at that commit.
          later = json.loads(Path('docs/evidence/secret-scan-reviewed-digests-20261017.json').read_text())
          if len(later) != 1:
              raise SystemExit('Unexpected 17 October digest-review count')
          entry = later[0]
          commit, path, rule, number = entry['fingerprint'].split(':')
          if (not re.fullmatch(r'[0-9a-f]{40}', commit) or path != 'contracts/manifest.json'
                  or rule != 'generic-api-key' or number != '13'
                  or entry.get('digest_of') != 'contracts/openapi.json'):
              raise SystemExit('17 October digest review identity changed')
          line = subprocess.check_output(['git', 'show', f'{commit}:{path}']).decode('utf-8').splitlines()[12]
          parsed = re.fullmatch(r'\s*"openapi\.json": "([0-9a-f]{64})",?', line)
          actual_digest = hashlib.sha256(subprocess.check_output(['git', 'show', f'{commit}:contracts/openapi.json'])).hexdigest()
          if parsed is None or parsed[1] != entry.get('sha256') or actual_digest != entry.get('sha256'):
              raise SystemExit('17 October OpenAPI finding is not the reviewed file digest')
          fingerprints.append(entry['fingerprint'])

          # 21 Oct 2026: Claim.v1 gained an optional registered event fact, so the
          # OpenAPI digest in the manifest changed again. Re-prove the one exact
          # fingerprint: the flagged line must be the manifest's openapi.json field and
          # equal SHA-256 of openapi.json at that commit. No rule or path is exempted.
          newest = json.loads(Path('docs/evidence/secret-scan-reviewed-digests-20261021.json').read_text())
          if len(newest) != 1:
              raise SystemExit('Unexpected 21 October digest-review count')
          entry = newest[0]
          commit, path, rule, number = entry['fingerprint'].split(':')
          if (not re.fullmatch(r'[0-9a-f]{40}', commit) or path != 'contracts/manifest.json'
                  or rule != 'generic-api-key' or number != '13'
                  or entry.get('digest_of') != 'contracts/openapi.json'):
              raise SystemExit('21 October digest review identity changed')
          line = subprocess.check_output(['git', 'show', f'{commit}:{path}']).decode('utf-8').splitlines()[12]
          parsed = re.fullmatch(r'\s*"openapi\.json": "([0-9a-f]{64})",?', line)
          actual_digest = hashlib.sha256(subprocess.check_output(['git', 'show', f'{commit}:contracts/openapi.json'])).hexdigest()
          if parsed is None or parsed[1] != entry.get('sha256') or actual_digest != entry.get('sha256'):
              raise SystemExit('21 October OpenAPI finding is not the reviewed file digest')
          fingerprints.append(entry['fingerprint'])

          # 23 Oct 2026 (tracking): MatchEvent gained optional synthetic tracking fields and
          # MetricAssertion the kilometres unit, so the OpenAPI digest changed again. Re-prove
          # the one exact fingerprint the same way; no rule or path is exempted.
          tracking = json.loads(Path('docs/evidence/secret-scan-reviewed-digests-20261023-tracking.json').read_text())
          if len(tracking) != 1:
              raise SystemExit('Unexpected tracking digest-review count')
          entry = tracking[0]
          commit, path, rule, number = entry['fingerprint'].split(':')
          if (not re.fullmatch(r'[0-9a-f]{40}', commit) or path != 'contracts/manifest.json'
                  or rule != 'generic-api-key' or number != '13'
                  or entry.get('digest_of') != 'contracts/openapi.json'):
              raise SystemExit('Tracking digest review identity changed')
          line = subprocess.check_output(['git', 'show', f'{commit}:{path}']).decode('utf-8').splitlines()[12]
          parsed = re.fullmatch(r'\s*"openapi\.json": "([0-9a-f]{64})",?', line)
          actual_digest = hashlib.sha256(subprocess.check_output(['git', 'show', f'{commit}:contracts/openapi.json'])).hexdigest()
          if parsed is None or parsed[1] != entry.get('sha256') or actual_digest != entry.get('sha256'):
              raise SystemExit('Tracking OpenAPI finding is not the reviewed file digest')
          fingerprints.append(entry['fingerprint'])

          # 23 Oct 2026 (cards): Claim.v1 gained the card.v1 and substitution.v1 event-fact
          # queries, so the OpenAPI digest changed again. Re-prove the one exact fingerprint.
          cards = json.loads(Path('docs/evidence/secret-scan-reviewed-digests-20261023-cards.json').read_text())
          if len(cards) != 1:
              raise SystemExit('Unexpected cards digest-review count')
          entry = cards[0]
          commit, path, rule, number = entry['fingerprint'].split(':')
          if (not re.fullmatch(r'[0-9a-f]{40}', commit) or path != 'contracts/manifest.json'
                  or rule != 'generic-api-key' or number != '13'
                  or entry.get('digest_of') != 'contracts/openapi.json'):
              raise SystemExit('Cards digest review identity changed')
          line = subprocess.check_output(['git', 'show', f'{commit}:{path}']).decode('utf-8').splitlines()[12]
          parsed = re.fullmatch(r'\s*"openapi\.json": "([0-9a-f]{64})",?', line)
          actual_digest = hashlib.sha256(subprocess.check_output(['git', 'show', f'{commit}:contracts/openapi.json'])).hexdigest()
          if parsed is None or parsed[1] != entry.get('sha256') or actual_digest != entry.get('sha256'):
              raise SystemExit('Cards OpenAPI finding is not the reviewed file digest')
          fingerprints.append(entry['fingerprint'])

          # 19 Oct 2026: Gitleaks correctly flagged one JWT-shaped string in
          # offline BFF tests. That literal was deliberately written as a fake
          # signature with a synthetic subject; review only the exact historical
          # commit/path/line, never a rule-wide or filename-wide exemption.
          metric_units = json.loads(Path('docs/evidence/secret-scan-reviewed-digests-20261023.json').read_text())
          if len(metric_units) != 1:
              raise SystemExit('Unexpected 23 October digest-review count')
          entry = metric_units[0]
          commit, path, rule, number = entry['fingerprint'].split(':')
          if (not re.fullmatch(r'[0-9a-f]{40}', commit) or path != 'contracts/manifest.json'
                  or rule != 'generic-api-key' or number != '13'
                  or entry.get('digest_of') != 'contracts/openapi.json'):
              raise SystemExit('23 October digest review identity changed')
          line = subprocess.check_output(['git', 'show', f'{commit}:{path}']).decode('utf-8').splitlines()[12]
          parsed = re.fullmatch(r'\s*"openapi\.json": "([0-9a-f]{64})",?', line)
          actual_digest = hashlib.sha256(subprocess.check_output(['git', 'show', f'{commit}:contracts/openapi.json'])).hexdigest()
          if parsed is None or parsed[1] != entry.get('sha256') or actual_digest != entry.get('sha256'):
              raise SystemExit('23 October OpenAPI finding is not the reviewed file digest')
          fingerprints.append(entry['fingerprint'])

          synthetic = json.loads(Path(
              'docs/evidence/secret-scan-reviewed-synthetic-20261019.json'
          ).read_text())
          if len(synthetic) != 1:
              raise SystemExit('Unexpected synthetic fixture review scope')
          entry = synthetic[0]
          expected = (
              '6f96c2cb7e6fb8e1bec378a9e137d7da32cc12c1:'
              'apps/web/tests/workforce-bff.test.mjs:generic-api-key:18'
          )
          if (entry.get('fingerprint') != expected
                  or entry.get('classification') != 'SYNTHETIC_NON_WORKING_JWT_TEST_FIXTURE'
                  or entry.get('sha256_line_utf8') !=
                  'f572ea66a35b1aaadd7e69cd7d6a02c104860924ffc44c0737120f3c22adae57'):
              raise SystemExit('Synthetic JWT fixture fingerprint or digest changed')
          commit, path, rule, number = expected.split(':')
          line = subprocess.check_output([
              'git', 'show', f'{commit}:{path}'
          ]).decode('utf-8').splitlines()[int(number) - 1]
          if not re.fullmatch(
              r"const ACCESS = '[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+';", line
          ) or hashlib.sha256(line.encode('utf-8')).hexdigest() != entry['sha256_line_utf8']:
              raise SystemExit('Historical JWT fixture source bytes changed')
          from base64 import urlsafe_b64decode
          parts = line.split("'")[1].split('.')
          def jwt_part(part):
              return json.loads(urlsafe_b64decode(part + '=' * (-len(part) % 4)))
          if (len(parts) != 3
                  or jwt_part(parts[0]) != {'alg': 'RS256'}
                  or jwt_part(parts[1]) != {'sub': '1'}
                  or not re.fullmatch(r'signaturetest[0-9]{6}', parts[2])):
              raise SystemExit('Flagged JWT-looking bytes are not the proved test fixture')
          fingerprints.append(expected)

          if len(fingerprints) != 33 or len(set(fingerprints)) != 33:
              raise SystemExit('Unexpected exact-fingerprint scope after new digest review')
          output = Path(os.environ['RUNNER_TEMP']) / 'matchdesk-no-ignores' / 'reviewed.ignore'
          output.write_text('\n'.join(fingerprints) + '\n')
          Path('artifacts/secrets/classification.json').write_text(json.dumps({
              'status': 'VERIFIED_NON_SECRET_DIGESTS_AND_TEST_FIXTURE',
              'reviewed_record_count': len(records),
              'reviewed_synthetic_fixtures': synthetic,
              'exact_fingerprint_count': len(fingerprints),
              'scope': 'Exact commit/path/rule/line fingerprints only; no path or rule-wide exclusions',
              'squash_commit': squash_commit,
              'records': records,
              'derived_squash_aliases': squash_aliases}, indent=2) + '\n')
          print('Recomputed 32 reviewed digest fingerprints and one exact fake JWT fixture; no path or rule-wide exclusions.')
          PY
      - name: Confirm the scanner still detects a new synthetic key with the same exceptions
        run: |
          set -euo pipefail
          python - <<'PY'
          """Generate a non-working detection control outside the repository and never print it."""
          import os
          import secrets
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'matchdesk-secret-control'
          root.mkdir()
          (root / 'control.txt').write_text('api_key = "' + secrets.token_hex(32) + '"\n')
          PY
          set +e
          "$RUNNER_TEMP/matchdesk-gitleaks/gitleaks" dir "$RUNNER_TEMP/matchdesk-secret-control" \
            --redact=100 --no-banner --no-color --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$RUNNER_TEMP/matchdesk-no-ignores/reviewed.ignore" \
            --exit-code 1 --report-format json --report-path artifacts/secrets/control-findings.json \
            > artifacts/secrets/control.log 2>&1
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          """Distinguish a real detected control from an unrelated scanner failure."""
          import json
          from pathlib import Path
          findings = json.loads(Path('artifacts/secrets/control-findings.json').read_text())
          if not findings or not any(item.get('RuleID') == 'generic-api-key' for item in findings):
              raise SystemExit('The synthetic detection control was not identified')
          print('Synthetic detection control passed; no working credential was used.')
          PY
      - name: Scan reachable history with exact reviewed fingerprints only
        run: |
          set -euo pipefail
          test ! -e .gitleaks.toml
          test ! -e .gitleaksignore
          "$RUNNER_TEMP/matchdesk-gitleaks/gitleaks" git . \
            --log-opts='--all' --redact=100 --no-banner --no-color \
            --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/matchdesk-no-ignores/reviewed.ignore" \
            --exit-code 1 --report-format json --report-path artifacts/secrets/findings.json \
            2>&1 | tee artifacts/secrets/scan.log
      - name: Preserve redacted security evidence even after a finding
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-secrets-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/secrets/
          if-no-files-found: error
          retention-days: 60
