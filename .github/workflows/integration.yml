# Run a disposable local topology on a hosted runner. No cloud or repository writes.
name: Foundation integration
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  runtime-browser:
    runs-on: ubuntu-24.04
    # The additional bound allows three image scans after the existing runtime tests.
    timeout-minutes: 30
    env:
      CI: 'true'
      COMPOSE_PROJECT_NAME: matchdesk-it-${{ github.run_id }}-${{ github.run_attempt }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Record source and create an ephemeral database password
        run: |
          set -euo pipefail
          mkdir -p artifacts/integration artifacts/image-security
          git rev-parse HEAD > artifacts/integration/source-commit.txt
          docker version > artifacts/integration/docker-version.txt
          docker compose version >> artifacts/integration/docker-version.txt
          node --version > artifacts/integration/node-version.txt
          sha256sum uv.lock apps/web/package-lock.json e2e/package-lock.json backend/Dockerfile backend/postgres/Dockerfile apps/web/Dockerfile docker-compose.yml > artifacts/integration/input-hashes.txt
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build and start the actual runtime containers
        id: start
        run: |
          set -euo pipefail
          docker compose --project-name "$COMPOSE_PROJECT_NAME" build --pull 2>&1 | tee artifacts/integration/build.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" up --detach --wait --wait-timeout 180
      - name: Test real HTTP, runtime boundaries and PostgreSQL restart persistence
        id: runtime
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: node e2e/runtime-checks.mjs 2>&1 | tee artifacts/integration/runtime.log
      - name: Install locked browser harness and matching Chromium
        id: browser
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        working-directory: e2e
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Run browser regressions without retrying failures away
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        working-directory: e2e
        run: npm test 2>&1 | tee ../artifacts/integration/browser.log
      - name: Install the verified native-image scanner and current database
        id: scanner
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        # This is the official 0.75.0 Linux-64bit asset, independently inspected before pinning.
        # No curl-to-shell execution, repository token or downloaded installer is used.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matchdesk-trivy-bin" "$RUNNER_TEMP/matchdesk-trivy-cache"
          archive="$RUNNER_TEMP/matchdesk-trivy.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz -o "$archive"
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/matchdesk-trivy-bin" trivy
          "$RUNNER_TEMP/matchdesk-trivy-bin/trivy" --version | tee artifacts/image-security/scanner-version.txt
          grep -Fx 'Version: 0.75.0' artifacts/image-security/scanner-version.txt
          printf '{}\n' > "$RUNNER_TEMP/matchdesk-trivy.yaml"
          "$RUNNER_TEMP/matchdesk-trivy-bin/trivy" --config "$RUNNER_TEMP/matchdesk-trivy.yaml" \
            --cache-dir "$RUNNER_TEMP/matchdesk-trivy-cache" image --download-db-only \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 2>&1 | tee artifacts/image-security/database-download.log
      - name: Collect complete scans of the exact runtime-tested image IDs
        if: ${{ !cancelled() && steps.scanner.outcome == 'success' }}
        # Collection saves findings; the separate native-images job enforces the verdict.
        # The images are inspected before the existing cleanup removes the containers.
        run: |
          python scripts/image_security.py collect artifacts/image-security \
            --scanner "$RUNNER_TEMP/matchdesk-trivy-bin/trivy" \
            --cache "$RUNNER_TEMP/matchdesk-trivy-cache"
      - name: Retain image inventories and scan failures for the independent gate
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/image-security/
          if-no-files-found: error
          retention-days: 60
      - name: Confirm source and locks were not rewritten
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Preserve safe container logs
        if: ${{ always() }}
        run: |
          # Never export docker inspect Env or the interpolated Compose configuration.
          docker compose --project-name "$COMPOSE_PROJECT_NAME" logs --no-color --tail 150 > artifacts/integration/container.log 2>&1
          docker compose --project-name "$COMPOSE_PROJECT_NAME" ps --all > artifacts/integration/containers.txt
      - name: Remove only this run's isolated containers and volumes
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [[ "$COMPOSE_PROJECT_NAME" =~ ^matchdesk-it-[0-9]+-[0-9]+$ ]]
          docker compose --project-name "$COMPOSE_PROJECT_NAME" down --volumes --remove-orphans
      - name: Retain results, screenshots and failed traces
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/integration/
          if-no-files-found: error
          retention-days: 60
  native-images:
    # A missing/failed collection must produce a failing gate, not a skipped green check.
    needs: runtime-browser
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: image-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/image-security
      - name: Require complete image-bound evidence and zero unreviewed findings
        run: |
          python scripts/image_security.py gate artifacts/image-security \
            --source "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID"
      - name: Retain the independent image-security verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-security-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/image-security/verdict.json
          if-no-files-found: error
          retention-days: 60
