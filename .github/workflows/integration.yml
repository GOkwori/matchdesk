                 'public.matchdesk_customer_sessions', 'DELETE') THEN
              RAISE EXCEPTION 'ID3G definer obtained session-delete access';
            END IF;
          END;
          $assert$;
          -- All test DDL and grants are rolled back, including this role/function.
          ROLLBACK;
          DO $cleanup$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM pg_catalog.pg_roles
              WHERE rolname = 'matchdesk_id3g_probe_definer_owner'
            ) OR EXISTS (
              SELECT 1 FROM pg_catalog.pg_proc WHERE proname = 'matchdesk_id3g_probe_definer'
            ) THEN
              RAISE EXCEPTION 'ID3G probe failed to roll back its role/function';
            END IF;
          END;
          $cleanup$;
          SQL
