# Run a disposable local topology on a hosted runner. No cloud or repository writes.
name: Foundation integration
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  runtime-browser:
    runs-on: ubuntu-24.04
    # The additional bound allows three image scans after the existing runtime tests.
    timeout-minutes: 30
    env:
      CI: 'true'
      COMPOSE_PROJECT_NAME: matchdesk-it-${{ github.run_id }}-${{ github.run_attempt }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Record source and create an ephemeral database password
        run: |
          set -euo pipefail
          mkdir -p artifacts/integration artifacts/image-security
          git rev-parse HEAD > artifacts/integration/source-commit.txt
          docker version > artifacts/integration/docker-version.txt
          docker compose version >> artifacts/integration/docker-version.txt
          node --version > artifacts/integration/node-version.txt
          sha256sum uv.lock apps/web/package-lock.json e2e/package-lock.json backend/Dockerfile backend/postgres/Dockerfile apps/web/Dockerfile docker-compose.yml > artifacts/integration/input-hashes.txt
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build and start the actual runtime containers
        id: start
        run: |
          set -euo pipefail
          docker compose --project-name "$COMPOSE_PROJECT_NAME" build --pull 2>&1 | tee artifacts/integration/build.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" up --detach --wait --wait-timeout 180
      - name: Test real HTTP, runtime boundaries and PostgreSQL restart persistence
        id: runtime
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: node e2e/runtime-checks.mjs 2>&1 | tee artifacts/integration/runtime.log
      - name: Qualify producer audit and CAS on real isolated PostgreSQL
        id: producer_storage
        if: ${{ !cancelled() && steps.start.outcome == 'success' && steps.runtime.outcome == 'success' }}
        run: node e2e/producer-store-postgres.mjs 2>&1 | tee artifacts/integration/producer-store-postgres.log
      - name: Verify restricted real-Psycopg producer transactions and recovery
        id: psycopg_storage
        if: ${{ !cancelled() && steps.producer_storage.outcome == 'success' }}
        run: |
          set -euo pipefail
          # A fresh, masked password exists only in this disposable workflow step.
          role_password="$(openssl rand -hex 32)"
          echo "::add-mask::$role_password"
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
            psql --no-psqlrc -X -v ON_ERROR_STOP=1 -U matchdesk -d matchdesk \
            -v role_password="$role_password" <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE ROLE matchdesk_producer_ci LOGIN PASSWORD :'role_password';
          GRANT CONNECT ON DATABASE matchdesk TO matchdesk_producer_ci;
          GRANT USAGE ON SCHEMA public TO matchdesk_producer_ci;
          GRANT SELECT, INSERT, UPDATE ON matchdesk_producer_cases TO matchdesk_producer_ci;
          GRANT SELECT, INSERT ON matchdesk_producer_audit TO matchdesk_producer_ci;
          -- CI-only failure injection: a valid case update must roll back too.
          CREATE FUNCTION matchdesk_ci_reject_selected_audit()
          RETURNS trigger LANGUAGE plpgsql AS $ci$
          BEGIN
            IF NEW.tenant_id='ci-tenant'
               AND NEW.entry_json->>'reason'='ci-rollback-probe' THEN
              RAISE EXCEPTION 'MatchDesk CI forced audit rollback';
            END IF;
            RETURN NEW;
          END;
          $ci$;
          CREATE TRIGGER matchdesk_ci_reject_selected_audit
          BEFORE INSERT ON matchdesk_producer_audit
          FOR EACH ROW EXECUTE FUNCTION matchdesk_ci_reject_selected_audit();
          SQL
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" api \
            /app/.venv/bin/python - initial < e2e/producer-store-psycopg.py \
            2>&1 | tee artifacts/integration/psycopg-producer-store.log
          # Reconnect from the non-root API container following a real DB restart.
          docker compose --project-name "$COMPOSE_PROJECT_NAME" restart postgres
          for attempt in $(seq 1 40); do
            if docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
              pg_isready -U matchdesk -d matchdesk > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" api \
            /app/.venv/bin/python - after-restart < e2e/producer-store-psycopg.py \
            2>&1 | tee -a artifacts/integration/psycopg-producer-store.log
      - name: Qualify real customer sessions under a restricted PostgreSQL role
        id: customer_sessions_storage
        if: ${{ !cancelled() && steps.psycopg_storage.outcome == 'success' }}
        run: |
          set -euo pipefail
          # Use only the existing disposable database; migration must be idempotent.
          for attempt in 1 2; do
            docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
              psql --no-psqlrc -X -v ON_ERROR_STOP=1 -U matchdesk -d matchdesk \
              < backend/postgres/migrations/002_customer_sessions.sql
          done
          role_password="$(openssl rand -hex 32)"
          echo "::add-mask::$role_password"
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
            psql --no-psqlrc -X -v ON_ERROR_STOP=1 -U matchdesk -d matchdesk \
            -v role_password="$role_password" <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE ROLE matchdesk_customer_session_ci LOGIN PASSWORD :'role_password';
          GRANT CONNECT ON DATABASE matchdesk TO matchdesk_customer_session_ci;
          GRANT USAGE ON SCHEMA public TO matchdesk_customer_session_ci;
          GRANT SELECT, INSERT, UPDATE ON matchdesk_customer_sessions
            TO matchdesk_customer_session_ci;
          -- CI-only fail-insert injection proves rotation revocation rolls back.
          CREATE FUNCTION matchdesk_ci_reject_session_successor()
          RETURNS trigger LANGUAGE plpgsql AS $ci$
          BEGIN
            IF NEW.account_id = 'ci-rollback' AND EXISTS (
              SELECT 1 FROM matchdesk_customer_sessions
               WHERE account_id = NEW.account_id
            ) THEN
              RAISE EXCEPTION 'MatchDesk CI forced session insert rollback';
            END IF;
            RETURN NEW;
          END;
          $ci$;
          CREATE TRIGGER matchdesk_ci_reject_session_successor
          BEFORE INSERT ON matchdesk_customer_sessions
          FOR EACH ROW EXECUTE FUNCTION matchdesk_ci_reject_session_successor();
          SQL
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" api \
            /app/.venv/bin/python - initial < e2e/customer-sessions-psycopg.py \
            2>&1 | tee artifacts/integration/customer-sessions-psycopg.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" restart postgres
          for attempt in $(seq 1 40); do
            if docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
              pg_isready -U matchdesk -d matchdesk > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" api \
            /app/.venv/bin/python - after-restart < e2e/customer-sessions-psycopg.py \
            2>&1 | tee -a artifacts/integration/customer-sessions-psycopg.log
      - name: Qualify real encrypted single-use OIDC state in PostgreSQL
        id: oidc_storage
        if: ${{ !cancelled() && steps.customer_sessions_storage.outcome == 'success' }}
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
              psql --no-psqlrc -X -v ON_ERROR_STOP=1 -U matchdesk -d matchdesk \
              < backend/postgres/migrations/003_oidc_login_attempts.sql
          done
          oidc_password="$(openssl rand -hex 32)"
          echo "::add-mask::$oidc_password"
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
            psql --no-psqlrc -X -v ON_ERROR_STOP=1 -U matchdesk -d matchdesk \
            -v role_password="$oidc_password" <<'SQL'
          CREATE ROLE matchdesk_oidc_ci LOGIN PASSWORD :'role_password';
          GRANT CONNECT ON DATABASE matchdesk TO matchdesk_oidc_ci;
          GRANT USAGE ON SCHEMA public TO matchdesk_oidc_ci;
          GRANT SELECT, INSERT, UPDATE ON matchdesk_oidc_login_attempts TO matchdesk_oidc_ci;
          SQL
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$oidc_password" api \
            /app/.venv/bin/python - initial < e2e/oidc-login-psycopg.py \
            2>&1 | tee artifacts/integration/oidc-login-psycopg.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" restart postgres
          for attempt in $(seq 1 40); do
            if docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
              pg_isready -U matchdesk -d matchdesk > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$oidc_password" api \
            /app/.venv/bin/python - after-restart < e2e/oidc-login-psycopg.py \
            2>&1 | tee -a artifacts/integration/oidc-login-psycopg.log
      - name: Qualify SELECT-only customer directory with real PostgreSQL
        id: account_directory
        if: ${{ !cancelled() && steps.oidc_storage.outcome == 'success' }}
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
              psql --no-psqlrc -X -v ON_ERROR_STOP=1 -U matchdesk -d matchdesk \
              < backend/postgres/migrations/004_customer_accounts.sql
          done
          role_password="$(openssl rand -hex 32)"
          echo "::add-mask::$role_password"
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
            psql --no-psqlrc -X -v ON_ERROR_STOP=1 -U matchdesk -d matchdesk \
            -v role_password="$role_password" <<'SQL'
          CREATE ROLE matchdesk_customer_registry_ci LOGIN PASSWORD :'role_password';
          GRANT CONNECT ON DATABASE matchdesk TO matchdesk_customer_registry_ci;
          GRANT USAGE ON SCHEMA public TO matchdesk_customer_registry_ci;
          GRANT SELECT ON matchdesk_customer_accounts TO matchdesk_customer_registry_ci;
          INSERT INTO matchdesk_customer_accounts
            (issuer, tenant_id, subject, account_id, state)
          VALUES
            ('https://ci.ciamlogin.com/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee/v2.0',
             'aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee', 'ci-registered', 'ci-1', 'active'),
            ('https://ci.ciamlogin.com/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee/v2.0',
             'aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee', 'ci-suspended', 'ci-2', 'suspended'),
            ('https://ci.ciamlogin.com/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee/v2.0',
             'aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee', 'ci-pending', 'ci-3', 'pending');
          SQL
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" api \
            /app/.venv/bin/python - initial < e2e/customer-accounts-psycopg.py \
            2>&1 | tee artifacts/integration/customer-accounts-psycopg.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" restart postgres
          for attempt in $(seq 1 40); do
            if docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
              pg_isready -U matchdesk -d matchdesk > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" api \
            /app/.venv/bin/python - after-restart < e2e/customer-accounts-psycopg.py \
            2>&1 | tee -a artifacts/integration/customer-accounts-psycopg.log
      - name: Require successful customer directory PostgreSQL qualification
        id: directory_gate
        if: ${{ !cancelled() && steps.oidc_storage.outcome == 'success' }}
        run: |
          test "${{ steps.account_directory.outcome }}" = success
      - name: Install locked browser harness and matching Chromium
        id: browser
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        working-directory: e2e
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Run browser regressions without retrying failures away
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        working-directory: e2e
        run: npm test 2>&1 | tee ../artifacts/integration/browser.log
      - name: Install the verified native-image scanner and current database
        id: scanner
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.producer_storage.outcome == 'success' && steps.psycopg_storage.outcome == 'success' && steps.customer_sessions_storage.outcome == 'success' && steps.oidc_storage.outcome == 'success' && steps.account_directory.outcome == 'success' && steps.directory_gate.outcome == 'success' }}
        # This is the official 0.75.0 Linux-64bit asset, independently inspected before pinning.
        # No curl-to-shell execution, repository token or downloaded installer is used.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matchdesk-trivy-bin" "$RUNNER_TEMP/matchdesk-trivy-cache"
          archive="$RUNNER_TEMP/matchdesk-trivy.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz -o "$archive"
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/matchdesk-trivy-bin" trivy
          "$RUNNER_TEMP/matchdesk-trivy-bin/trivy" --version | tee artifacts/image-security/scanner-version.txt
          grep -Fx 'Version: 0.75.0' artifacts/image-security/scanner-version.txt
          printf '{}\n' > "$RUNNER_TEMP/matchdesk-trivy.yaml"
          "$RUNNER_TEMP/matchdesk-trivy-bin/trivy" --config "$RUNNER_TEMP/matchdesk-trivy.yaml" \
            --cache-dir "$RUNNER_TEMP/matchdesk-trivy-cache" image --download-db-only \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 2>&1 | tee artifacts/image-security/database-download.log
      - name: Collect complete scans of the exact runtime-tested image IDs
        if: ${{ !cancelled() && steps.scanner.outcome == 'success' }}
        # Collection saves findings; the separate native-images job enforces the verdict.
        # The images are inspected before the existing cleanup removes the containers.
        run: |
          python scripts/image_security.py collect artifacts/image-security \
            --scanner "$RUNNER_TEMP/matchdesk-trivy-bin/trivy" \
            --cache "$RUNNER_TEMP/matchdesk-trivy-cache"
      - name: Retain image inventories and scan failures for the independent gate
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/image-security/
          if-no-files-found: error
          retention-days: 60
      - name: Confirm source and locks were not rewritten
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Preserve safe container logs
        if: ${{ always() }}
        run: |
          # Never export docker inspect Env or the interpolated Compose configuration.
          docker compose --project-name "$COMPOSE_PROJECT_NAME" logs --no-color --tail 150 > artifacts/integration/container.log 2>&1
          docker compose --project-name "$COMPOSE_PROJECT_NAME" ps --all > artifacts/integration/containers.txt
      - name: Remove only this run's isolated containers and volumes
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [[ "$COMPOSE_PROJECT_NAME" =~ ^matchdesk-it-[0-9]+-[0-9]+$ ]]
          docker compose --project-name "$COMPOSE_PROJECT_NAME" down --volumes --remove-orphans
      - name: Retain results, screenshots and failed traces
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/integration/
          if-no-files-found: error
          retention-days: 60
  native-images:
    # A missing/failed collection must produce a failing gate, not a skipped green check.
    needs: runtime-browser
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: image-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/image-security
      - name: Require complete image-bound evidence and zero unreviewed findings
        run: |
          python scripts/image_security.py gate artifacts/image-security \
            --source "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID"
      - name: Retain the independent image-security verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-security-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/image-security/verdict.json
          if-no-files-found: error
          retention-days: 60
