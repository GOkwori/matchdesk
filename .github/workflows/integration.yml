        id: id3g_role_probe
        if: ${{ !cancelled() && steps.directory_gate.outcome == 'success' }}
        run: |
          set -euo pipefail
          # This test runs only against the existing disposable GitHub integration DB.
          # PostgreSQL ROLLBACK must remove the probe role, function, and its grants.
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
            psql --no-psqlrc -X -v ON_ERROR_STOP=1 -U matchdesk -d matchdesk <<'SQL'
          BEGIN;
          SET LOCAL lock_timeout = '5s';
          CREATE ROLE matchdesk_id3g_probe_definer_owner
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE
            NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO matchdesk_id3g_probe_definer_owner;
          GRANT SELECT, UPDATE(state) ON public.matchdesk_customer_accounts
            TO matchdesk_id3g_probe_definer_owner;
          GRANT SELECT, UPDATE(revoked) ON public.matchdesk_customer_sessions
            TO matchdesk_id3g_probe_definer_owner;
          CREATE FUNCTION public.matchdesk_id3g_probe_definer()
          RETURNS boolean
          LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog
          AS $md$
          DECLARE
            found_account text;
          BEGIN
            SELECT a.account_id INTO found_account
            FROM public.matchdesk_customer_accounts AS a
            WHERE a.issuer = 'https://ci.ciamlogin.com/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee/v2.0'
              AND a.tenant_id = 'aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee'
              AND a.subject = 'ci-registered'
              AND a.state = 'active'
            FOR SHARE;
            RETURN current_user = 'matchdesk_id3g_probe_definer_owner'
               AND found_account = 'ci-1';
          END;
          $md$;
          REVOKE ALL ON FUNCTION public.matchdesk_id3g_probe_definer() FROM PUBLIC;
          ALTER FUNCTION public.matchdesk_id3g_probe_definer()
            OWNER TO matchdesk_id3g_probe_definer_owner;
          DO $assert$
          BEGIN
            IF NOT public.matchdesk_id3g_probe_definer() THEN
              RAISE EXCEPTION 'ID3G role cannot read and lock exactly its active account';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_catalog.pg_proc p
              JOIN pg_catalog.pg_roles r ON r.oid = p.proowner
              JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public' AND p.proname = 'matchdesk_id3g_probe_definer'
                AND p.prosecdef AND r.rolname = 'matchdesk_id3g_probe_definer_owner'
                AND NOT r.rolsuper AND NOT r.rolcanlogin AND NOT r.rolbypassrls
            ) THEN
              RAISE EXCEPTION 'ID3G definer is not the approved non-superuser';
            END IF;
            IF EXISTS (
              SELECT 1 FROM pg_catalog.pg_auth_members m
              JOIN pg_catalog.pg_roles r ON r.oid = m.roleid
              WHERE r.rolname = 'matchdesk_id3g_probe_definer_owner'
            ) THEN
