            /app/.venv/bin/python - < e2e/id3j-catalog-psycopg.py \
            2>&1 | tee artifacts/integration/id3j-catalog.log
          # ID3L tests BOTH independently signed synthetic identities against
          # one actual restricted physical PostgreSQL session. No live IdP or
          # write-time execution claim is made; keys exist only inside CI.
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" api \
            /app/.venv/bin/python - < e2e/id3l-principal-postgres-psycopg.py \
            2>&1 | tee artifacts/integration/id3l-principal-postgres.log
          grep -Fx 'MATCHDESK_ID3L_REAL_POSTGRESQL_DUAL_PRINCIPAL_PASS' \
            artifacts/integration/id3l-principal-postgres.log >/dev/null
          # A real newly added database CREATE capability must be detected.
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
            psql --no-psqlrc -X -v ON_ERROR_STOP=1 -U matchdesk -d postgres \
            -c 'GRANT CREATE ON DATABASE matchdesk_id3j_ci TO matchdesk_id3j_reader_ci'
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" \
            -e ID3L_EXPECT_ELEVATION_DENIAL=true api \
            /app/.venv/bin/python - < e2e/id3l-principal-postgres-psycopg.py \
            2>&1 | tee artifacts/integration/id3l-elevated-role-rejected.log
          grep -Fx 'MATCHDESK_ID3L_ELEVATED_ROLE_REJECTED' \
            artifacts/integration/id3l-elevated-role-rejected.log >/dev/null
          if docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
              -e CI=true -e "PGPASSWORD=$role_password" api \
              /app/.venv/bin/python - < e2e/id3j-catalog-psycopg.py \
              > artifacts/integration/id3j-elevated-role-rejected.log 2>&1; then
            echo "ID3J ERROR: elevated role unexpectedly qualified" >&2
            exit 1
          fi
          grep -F 'ID3J disposable catalog preflight denied' \
            artifacts/integration/id3j-elevated-role-rejected.log >/dev/null
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
            psql --no-psqlrc -X -v ON_ERROR_STOP=1 -U matchdesk -d postgres \
            -c 'REVOKE CREATE ON DATABASE matchdesk_id3j_ci FROM matchdesk_id3j_reader_ci'
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" api \
            /app/.venv/bin/python - < e2e/id3j-catalog-psycopg.py \
            2>&1 | tee -a artifacts/integration/id3j-catalog.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" api \
            /app/.venv/bin/python - < e2e/id3l-principal-postgres-psycopg.py \
            2>&1 | tee -a artifacts/integration/id3l-principal-postgres.log
          grep -cFx 'MATCHDESK_ID3L_REAL_POSTGRESQL_DUAL_PRINCIPAL_PASS' \
            artifacts/integration/id3l-principal-postgres.log | grep -Fx '2'
          echo 'MATCHDESK_ID3J_REAL_POSTGRESQL_NEGATIVE_PASS'
      - name: Install locked browser harness and matching Chromium
        id: browser
        # Do not spend runner time after the security-critical pending-vault
        # real-PostgreSQL prerequisite fails closed.
        if: ${{ !cancelled() && steps.start.outcome == 'success' && steps.workforce_stepup_storage.outcome == 'success' }}
        working-directory: e2e
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      # Execute functional and screenshot-heavy reviews in separate browser
      # processes. Preserve both exit codes, with zero retries and separate
      # report directories; an evidence capture failure remains a CI failure.
      - name: Run functional browser regressions without retrying failures away
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        working-directory: e2e
        env:
          MATCHDESK_E2E_SUITE: functional
        run: |
          set -euo pipefail
          npm test -- --grep-invert '@visual-capture' 2>&1 | tee ../artifacts/integration/browser-functional.log
      - name: Run isolated visual evidence captures without retries
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        working-directory: e2e
        env:
          MATCHDESK_E2E_SUITE: visual
        run: |
          set -euo pipefail
          npm test -- --grep '@visual-capture' 2>&1 | tee ../artifacts/integration/browser-visual.log
      - name: Qualify physical SELECT-only human-confirmation provenance
        id: provenance_storage
        if: ${{ !cancelled() && steps.producer_bridge_psycopg.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: |
          set -euo pipefail
          [[ "$COMPOSE_PROJECT_NAME" =~ ^matchdesk-it-[0-9]+-[0-9]+$ ]]
          for n in 1 2; do
            docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
              psql --no-psqlrc --set ON_ERROR_STOP=1 --username matchdesk \
              --dbname matchdesk \
              < backend/postgres/migrations/013_producer_host_confirmation_provenance.sql \
              > "artifacts/integration/producer-provenance-migration-$n.log"
          done
          reader_password="$(openssl rand -hex 32)"
          echo "::add-mask::$reader_password"
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME" \
            -e "PGPASSWORD=$POSTGRES_PASSWORD" \
            -e "READER_CI_PASSWORD=$reader_password" api \
            /app/.venv/bin/python - < e2e/producer-host-provenance-psycopg.py \
            2>&1 | tee artifacts/integration/producer-host-provenance-psycopg.log
          grep -Fx "MATCHDESK_P4_REAL_HOST_PROVENANCE_READER_PASS: SELECT-only SCRAM, tenant scope, terminal revocation, DML drift and immutability" \
            artifacts/integration/producer-host-provenance-psycopg.log
      - name: Install the verified native-image scanner and current database
        id: scanner
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.producer_storage.outcome == 'success' && steps.psycopg_storage.outcome == 'success' && steps.customer_sessions_storage.outcome == 'success' && steps.oidc_storage.outcome == 'success' && steps.account_directory.outcome == 'success' && steps.directory_gate.outcome == 'success' && steps.id3g_role_probe.outcome == 'success' && steps.id3g_revocation_qa.outcome == 'success' && steps.id3g_revocation_gate.outcome == 'success' && steps.provenance_storage.outcome == 'success' }}
        # This is the official 0.75.0 Linux-64bit asset, independently inspected before pinning.
        # No curl-to-shell execution, repository token or downloaded installer is used.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matchdesk-trivy-bin" "$RUNNER_TEMP/matchdesk-trivy-cache"
          archive="$RUNNER_TEMP/matchdesk-trivy.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz -o "$archive"
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/matchdesk-trivy-bin" trivy
          "$RUNNER_TEMP/matchdesk-trivy-bin/trivy" --version | tee artifacts/image-security/scanner-version.txt
          grep -Fx 'Version: 0.75.0' artifacts/image-security/scanner-version.txt
          printf '{}\n' > "$RUNNER_TEMP/matchdesk-trivy.yaml"
          "$RUNNER_TEMP/matchdesk-trivy-bin/trivy" --config "$RUNNER_TEMP/matchdesk-trivy.yaml" \
            --cache-dir "$RUNNER_TEMP/matchdesk-trivy-cache" image --download-db-only \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 2>&1 | tee artifacts/image-security/database-download.log
      - name: Collect complete scans of the exact runtime-tested image IDs
        if: ${{ !cancelled() && steps.scanner.outcome == 'success' }}
        # Collection saves findings; the separate native-images job enforces the verdict.
        # The images are inspected before the existing cleanup removes the containers.
        run: |
          python scripts/image_security.py collect artifacts/image-security \
            --scanner "$RUNNER_TEMP/matchdesk-trivy-bin/trivy" \
            --cache "$RUNNER_TEMP/matchdesk-trivy-cache"
      - name: Retain image inventories and scan failures for the independent gate
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/image-security/
          if-no-files-found: error
          retention-days: 60
      - name: Confirm source and locks were not rewritten
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Preserve safe container logs
        if: ${{ always() }}
        run: |
          # Never export docker inspect Env or the interpolated Compose configuration.
          docker compose --project-name "$COMPOSE_PROJECT_NAME" logs --no-color --tail 150 > artifacts/integration/container.log 2>&1
          docker compose --project-name "$COMPOSE_PROJECT_NAME" ps --all > artifacts/integration/containers.txt
      - name: Remove only this run's isolated containers and volumes
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [[ "$COMPOSE_PROJECT_NAME" =~ ^matchdesk-it-[0-9]+-[0-9]+$ ]]
          docker compose --project-name "$COMPOSE_PROJECT_NAME" down --volumes --remove-orphans
      - name: Retain results, screenshots and failed traces
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/integration/
          if-no-files-found: error
          retention-days: 60
  native-images:
    # A missing/failed collection must produce a failing gate, not a skipped green check.
    needs: runtime-browser
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: image-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/image-security
      - name: Require complete image-bound evidence and zero unreviewed findings
        run: |
          python scripts/image_security.py gate artifacts/image-security \
            --source "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID"
      - name: Retain the independent image-security verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-security-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/image-security/verdict.json
          if-no-files-found: error
          retention-days: 60
