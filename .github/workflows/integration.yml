# Run a disposable local topology on a hosted runner. No cloud or repository writes.
name: Foundation integration
on:
  push:
    branches: [development, main, 'feat/sunset-v3-*']
  pull_request:
    branches: [development, main]
permissions:
  contents: read
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  runtime-browser:
    runs-on: ubuntu-24.04
    # The additional bound allows three image scans after the existing runtime tests.
    timeout-minutes: 30
    env:
      CI: 'true'
      COMPOSE_PROJECT_NAME: matchdesk-it-${{ github.run_id }}-${{ github.run_attempt }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Record source and create an ephemeral database password
        run: |
          set -euo pipefail
          mkdir -p artifacts/integration artifacts/image-security
          git rev-parse HEAD > artifacts/integration/source-commit.txt
          docker version > artifacts/integration/docker-version.txt
          docker compose version >> artifacts/integration/docker-version.txt
          node --version > artifacts/integration/node-version.txt
          sha256sum uv.lock apps/web/package-lock.json e2e/package-lock.json backend/Dockerfile backend/postgres/Dockerfile apps/web/Dockerfile docker-compose.yml > artifacts/integration/input-hashes.txt
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build and start the actual runtime containers
        id: start
        run: |
          set -euo pipefail
          docker compose --project-name "$COMPOSE_PROJECT_NAME" build --pull 2>&1 | tee artifacts/integration/build.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" up --detach --wait --wait-timeout 180
      - name: Test real HTTP, runtime boundaries and PostgreSQL restart persistence
        id: runtime
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: node e2e/runtime-checks.mjs 2>&1 | tee artifacts/integration/runtime.log
      - name: Qualify producer audit and CAS on real isolated PostgreSQL
        id: producer_storage
        if: ${{ !cancelled() && steps.start.outcome == 'success' && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          node e2e/producer-store-postgres.mjs 2>&1 | tee artifacts/integration/producer-store-postgres.log
          node e2e/producer-grant-postgres.mjs 2>&1 | tee artifacts/integration/producer-grant-postgres.log
      - name: Qualify atomic single-use producer grant write on disposable PostgreSQL
        id: grant_atomicity
        if: ${{ !cancelled() && steps.producer_storage.outcome == 'success' }}
        run: |
          set -euo pipefail
          node e2e/producer-grant-atomic-postgres.mjs 2>&1 | tee artifacts/integration/producer-grant-atomic.log
      - name: Qualify confirmed grant issuance on disposable PostgreSQL
        id: confirmed_issuer
        if: ${{ !cancelled() && steps.grant_atomicity.outcome == 'success' }}
        run: |
          set -euo pipefail
          node e2e/producer-confirmation-issuer-postgres.mjs 2>&1 | tee artifacts/integration/producer-confirmation-issuer.log
      - name: Qualify confirmation staging migration in disposable PostgreSQL
        id: confirmation_staging
        if: ${{ !cancelled() && steps.confirmed_issuer.outcome == 'success' }}
        run: |
          set -euo pipefail
          node e2e/producer-confirmation-staging-postgres.mjs 2>&1 | tee artifacts/integration/producer-confirmation-staging.log
      - name: Qualify separate physical issuer and revoker PostgreSQL logins
        id: physical_issuer
        if: ${{ !cancelled() && steps.confirmation_staging.outcome == 'success' }}
        run: |
          set -euo pipefail
          issuer_password="$(openssl rand -hex 32)"
          revoker_password="$(openssl rand -hex 32)"
          echo "::add-mask::$issuer_password"
          echo "::add-mask::$revoker_password"
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$POSTGRES_PASSWORD" \
            -e "ISSUER_CI_PASSWORD=$issuer_password" \
            -e "REVOKER_CI_PASSWORD=$revoker_password" api \
            /app/.venv/bin/python - setup < e2e/producer-confirmation-issuer-psycopg.py \
            2>&1 | tee artifacts/integration/producer-issuer-physical.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$issuer_password" api \
            /app/.venv/bin/python - issue < e2e/producer-confirmation-issuer-psycopg.py \
            2>&1 | tee -a artifacts/integration/producer-issuer-physical.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$revoker_password" api \
            /app/.venv/bin/python - revoke < e2e/producer-confirmation-issuer-psycopg.py \
            2>&1 | tee -a artifacts/integration/producer-issuer-physical.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$POSTGRES_PASSWORD" \
            -e "ISSUER_CI_PASSWORD=$issuer_password" \
            -e "REVOKER_CI_PASSWORD=$revoker_password" api \
            /app/.venv/bin/python - initial < e2e/producer-confirmation-races-psycopg.py \
            2>&1 | tee artifacts/integration/producer-issuer-races.log
          # Qualify a third physical login with no issuer/revoker or table DML authority.
          stager_password="$(openssl rand -hex 32)"
          echo "::add-mask::$stager_password"
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$POSTGRES_PASSWORD" \
            -e "STAGER_CI_PASSWORD=$stager_password" api \
            /app/.venv/bin/python - setup < e2e/producer-confirmation-staging-psycopg.py \
            2>&1 | tee artifacts/integration/producer-confirmation-stager.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$stager_password" \
            -e "STAGER_CI_PASSWORD=$stager_password" \
            -e "ISSUER_CI_PASSWORD=$issuer_password" \
            -e "REVOKER_CI_PASSWORD=$revoker_password" api \
            /app/.venv/bin/python - exercise < e2e/producer-confirmation-staging-psycopg.py \
            2>&1 | tee -a artifacts/integration/producer-confirmation-stager.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" restart postgres
          for attempt in $(seq 1 40); do
            if docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
              pg_isready -U matchdesk -d matchdesk > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$POSTGRES_PASSWORD" api \
            /app/.venv/bin/python - verify < e2e/producer-confirmation-issuer-psycopg.py \
            2>&1 | tee -a artifacts/integration/producer-issuer-physical.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$POSTGRES_PASSWORD" api \
            /app/.venv/bin/python - verify < e2e/producer-confirmation-races-psycopg.py \
            2>&1 | tee -a artifacts/integration/producer-issuer-races.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$POSTGRES_PASSWORD" api \
            /app/.venv/bin/python - verify < e2e/producer-confirmation-staging-psycopg.py \
            2>&1 | tee -a artifacts/integration/producer-confirmation-stager.log
      - name: Qualify grant writer through a physical restricted PostgreSQL login
        id: grant_psycopg
        if: ${{ !cancelled() && steps.physical_issuer.outcome == 'success' && steps.grant_atomicity.outcome == 'success' }}
        run: |
          set -euo pipefail
          role_password="$(openssl rand -hex 32)"
          echo "::add-mask::$role_password"
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$POSTGRES_PASSWORD" \
            -e "GRANT_WRITER_CI_PASSWORD=$role_password" api \
            /app/.venv/bin/python - setup < e2e/producer-grant-restricted-setup.py \
            2>&1 | tee artifacts/integration/producer-grant-setup.log
          # The valid one-use grant must NOT be spent if an unrelated table
          # has accidentally been granted to this restricted workload login.
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$POSTGRES_PASSWORD" api \
            /app/.venv/bin/python - elevate < e2e/producer-grant-restricted-setup.py \
            2>&1 | tee artifacts/integration/producer-grant-extra-dml.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" api \
            /app/.venv/bin/python - elevated < e2e/producer-grant-restricted-psycopg.py \
            2>&1 | tee -a artifacts/integration/producer-grant-extra-dml.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$POSTGRES_PASSWORD" api \
            /app/.venv/bin/python - restore < e2e/producer-grant-restricted-setup.py \
            2>&1 | tee -a artifacts/integration/producer-grant-extra-dml.log
          # A writer gaining an issuer SECURITY DEFINER function can mint
          # authority outside the intended role separation: reject before use.
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$POSTGRES_PASSWORD" api \
            /app/.venv/bin/python - issuer-elevate < e2e/producer-grant-restricted-setup.py \
            2>&1 | tee artifacts/integration/producer-grant-issuer-drift.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" api \
            /app/.venv/bin/python - issuer-elevated < e2e/producer-grant-restricted-psycopg.py \
            2>&1 | tee -a artifacts/integration/producer-grant-issuer-drift.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$POSTGRES_PASSWORD" api \
            /app/.venv/bin/python - issuer-restore < e2e/producer-grant-restricted-setup.py \
            2>&1 | tee -a artifacts/integration/producer-grant-issuer-drift.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" api \
            /app/.venv/bin/python - initial < e2e/producer-grant-restricted-psycopg.py \
            2>&1 | tee artifacts/integration/producer-grant-psycopg.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" restart postgres
          for attempt in $(seq 1 40); do
            if docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
              pg_isready -U matchdesk -d matchdesk > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" api \
            /app/.venv/bin/python - after-restart < e2e/producer-grant-restricted-psycopg.py \
            2>&1 | tee -a artifacts/integration/producer-grant-psycopg.log
          # Independent owner-only reconciliation: the restricted writer has
          # no SELECT privilege on the case, audit or grant tables.
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$POSTGRES_PASSWORD" api \
            /app/.venv/bin/python - verify < e2e/producer-grant-restricted-setup.py \
            2>&1 | tee artifacts/integration/producer-grant-restart-reconciliation.log
      - name: Qualify signed bridge with distinct physical PostgreSQL logins
        id: producer_bridge_psycopg
        if: ${{ !cancelled() && steps.grant_psycopg.outcome == 'success' && steps.physical_issuer.outcome == 'success' }}
        run: |
          set -euo pipefail
          # Qualify the *actual* host provenance store inside the signed
          # bridge, not merely a synthetic in-memory confirmation reader.
          # The schema is disposable and must tolerate an exact replay of
          # its forward-only migration before the later independent gate.
          for n in 1 2; do
            docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
              psql --no-psqlrc --set ON_ERROR_STOP=1 --username matchdesk \
              --dbname matchdesk \
              < backend/postgres/migrations/013_producer_host_confirmation_provenance.sql \
              > "artifacts/integration/producer-bridge-provenance-migration-$n.log"
          done
          # Migration 014 is deliberately applied only AFTER legacy 011/012
          # issuer qualification, and BEFORE all signed real-host bridge writes.
          # Both passes must succeed; no live database is touched.
          for n in 1 2; do
            docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
              psql --no-psqlrc --set ON_ERROR_STOP=1 --username matchdesk \
              --dbname matchdesk \
              < backend/postgres/migrations/014_producer_terminal_revocation_serialization.sql \
              > "artifacts/integration/producer-serialization-migration-$n.log"
          done
          # The issuer SECURITY DEFINER owner is a NOLOGIN role with fixed
          # minimum table ACLs. Reading the authoritative event/terminal
          # state is required for SQL-serialized issuance; do not grant these
          # to the physical issuer LOGIN, writer, stager or PUBLIC.
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
            psql --no-psqlrc --set ON_ERROR_STOP=1 --username matchdesk \
            --dbname matchdesk \
            -c "GRANT SELECT ON public.matchdesk_producer_host_confirmation_events, public.matchdesk_producer_host_confirmation_terminals TO matchdesk_issuer_definer_ci" \
            > artifacts/integration/producer-serialization-definer-acl.log
          bridge_stager_password="$(openssl rand -hex 32)"
          bridge_issuer_password="$(openssl rand -hex 32)"
          bridge_writer_password="$(openssl rand -hex 32)"
          bridge_revoker_password="$(openssl rand -hex 32)"
          bridge_provenance_password="$(openssl rand -hex 32)"
          echo "::add-mask::$bridge_stager_password"
          echo "::add-mask::$bridge_issuer_password"
          echo "::add-mask::$bridge_writer_password"
          echo "::add-mask::$bridge_revoker_password"
          echo "::add-mask::$bridge_provenance_password"
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME" \
            -e "PGPASSWORD=$POSTGRES_PASSWORD" \
            -e "STAGER_CI_PASSWORD=$bridge_stager_password" \
            -e "ISSUER_CI_PASSWORD=$bridge_issuer_password" \
            -e "GRANT_WRITER_CI_PASSWORD=$bridge_writer_password" \
            -e "REVOKER_CI_PASSWORD=$bridge_revoker_password" \
            -e "BRIDGE_READER_CI_PASSWORD=$bridge_provenance_password" api \
            /app/.venv/bin/python - < e2e/producer-atomic-bridge-psycopg.py \
            2>&1 | tee artifacts/integration/producer-atomic-bridge-psycopg.log
          # Real independent issuer and terminal-writer transactions prove
          # BOTH serialization orders and authoritative grant readback.
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME" \
            -e "PGPASSWORD=$POSTGRES_PASSWORD" \
            -e "ISSUER_CI_PASSWORD=$bridge_issuer_password" api \
            /app/.venv/bin/python - < e2e/producer-terminal-issuance-races-psycopg.py \
            2>&1 | tee artifacts/integration/producer-terminal-issuance-races.log
          grep -Fx "MATCHDESK_P4_TERMINAL_ISSUANCE_SERIALIZED_PASS: terminal-first denies, issuance-first revokes unspent grant" \
            artifacts/integration/producer-terminal-issuance-races.log
      - name: Verify restricted real-Psycopg producer transactions and recovery
        id: psycopg_storage
        if: ${{ !cancelled() && steps.producer_bridge_psycopg.outcome == 'success' && steps.producer_storage.outcome == 'success' }}
        run: |
          set -euo pipefail
          # A fresh, masked password exists only in this disposable workflow step.
          role_password="$(openssl rand -hex 32)"
          echo "::add-mask::$role_password"
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
            psql --no-psqlrc -X -v ON_ERROR_STOP=1 -U matchdesk -d matchdesk \
            -v role_password="$role_password" <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE ROLE matchdesk_producer_ci LOGIN PASSWORD :'role_password';
          GRANT CONNECT ON DATABASE matchdesk TO matchdesk_producer_ci;
          GRANT USAGE ON SCHEMA public TO matchdesk_producer_ci;
          GRANT SELECT, INSERT, UPDATE ON matchdesk_producer_cases TO matchdesk_producer_ci;
          GRANT SELECT, INSERT ON matchdesk_producer_audit TO matchdesk_producer_ci;
          -- CI-only failure injection: a valid case update must roll back too.
          CREATE FUNCTION matchdesk_ci_reject_selected_audit()
          RETURNS trigger LANGUAGE plpgsql AS $ci$
          BEGIN
            IF NEW.tenant_id='ci-tenant'
               AND NEW.entry_json->>'reason'='ci-rollback-probe' THEN
              RAISE EXCEPTION 'MatchDesk CI forced audit rollback';
            END IF;
            RETURN NEW;
          END;
          $ci$;
          CREATE TRIGGER matchdesk_ci_reject_selected_audit
          BEFORE INSERT ON matchdesk_producer_audit
          FOR EACH ROW EXECUTE FUNCTION matchdesk_ci_reject_selected_audit();
          SQL
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" api \
            /app/.venv/bin/python - initial < e2e/producer-store-psycopg.py \
            2>&1 | tee artifacts/integration/psycopg-producer-store.log
          # Reconnect from the non-root API container following a real DB restart.
          docker compose --project-name "$COMPOSE_PROJECT_NAME" restart postgres
          for attempt in $(seq 1 40); do
            if docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
              pg_isready -U matchdesk -d matchdesk > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" api \
            /app/.venv/bin/python - after-restart < e2e/producer-store-psycopg.py \
            2>&1 | tee -a artifacts/integration/psycopg-producer-store.log
      - name: Qualify real customer sessions under a restricted PostgreSQL role
        id: customer_sessions_storage
        if: ${{ !cancelled() && steps.psycopg_storage.outcome == 'success' }}
        run: |
          set -euo pipefail
          # Use only the existing disposable database; migration must be idempotent.
          for attempt in 1 2; do
            docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
              psql --no-psqlrc -X -v ON_ERROR_STOP=1 -U matchdesk -d matchdesk \
              < backend/postgres/migrations/002_customer_sessions.sql
          done
          role_password="$(openssl rand -hex 32)"
          echo "::add-mask::$role_password"
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
            psql --no-psqlrc -X -v ON_ERROR_STOP=1 -U matchdesk -d matchdesk \
            -v role_password="$role_password" <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE ROLE matchdesk_customer_session_ci LOGIN PASSWORD :'role_password';
          GRANT CONNECT ON DATABASE matchdesk TO matchdesk_customer_session_ci;
          GRANT USAGE ON SCHEMA public TO matchdesk_customer_session_ci;
          GRANT SELECT, INSERT, UPDATE ON matchdesk_customer_sessions
            TO matchdesk_customer_session_ci;
          -- CI-only fail-insert injection proves rotation revocation rolls back.
          CREATE FUNCTION matchdesk_ci_reject_session_successor()
          RETURNS trigger LANGUAGE plpgsql AS $ci$
          BEGIN
            IF NEW.account_id = 'ci-rollback' AND EXISTS (
              SELECT 1 FROM matchdesk_customer_sessions
               WHERE account_id = NEW.account_id
            ) THEN
              RAISE EXCEPTION 'MatchDesk CI forced session insert rollback';
            END IF;
            RETURN NEW;
          END;
          $ci$;
          CREATE TRIGGER matchdesk_ci_reject_session_successor
          BEFORE INSERT ON matchdesk_customer_sessions
          FOR EACH ROW EXECUTE FUNCTION matchdesk_ci_reject_session_successor();
          SQL
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" api \
            /app/.venv/bin/python - initial < e2e/customer-sessions-psycopg.py \
            2>&1 | tee artifacts/integration/customer-sessions-psycopg.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" restart postgres
          for attempt in $(seq 1 40); do
            if docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
              pg_isready -U matchdesk -d matchdesk > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$role_password" api \
            /app/.venv/bin/python - after-restart < e2e/customer-sessions-psycopg.py \
            2>&1 | tee -a artifacts/integration/customer-sessions-psycopg.log
      - name: Qualify real encrypted single-use OIDC state in PostgreSQL
        id: oidc_storage
        if: ${{ !cancelled() && steps.customer_sessions_storage.outcome == 'success' }}
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
              psql --no-psqlrc -X -v ON_ERROR_STOP=1 -U matchdesk -d matchdesk \
              < backend/postgres/migrations/003_oidc_login_attempts.sql
          done
          oidc_password="$(openssl rand -hex 32)"
          echo "::add-mask::$oidc_password"
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
            psql --no-psqlrc -X -v ON_ERROR_STOP=1 -U matchdesk -d matchdesk \
            -v role_password="$oidc_password" <<'SQL'
          CREATE ROLE matchdesk_oidc_ci LOGIN PASSWORD :'role_password';
          GRANT CONNECT ON DATABASE matchdesk TO matchdesk_oidc_ci;
          GRANT USAGE ON SCHEMA public TO matchdesk_oidc_ci;
          GRANT SELECT, INSERT, UPDATE ON matchdesk_oidc_login_attempts TO matchdesk_oidc_ci;
          SQL
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$oidc_password" api \
            /app/.venv/bin/python - initial < e2e/oidc-login-psycopg.py \
            2>&1 | tee artifacts/integration/oidc-login-psycopg.log
          docker compose --project-name "$COMPOSE_PROJECT_NAME" restart postgres
          for attempt in $(seq 1 40); do
            if docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T postgres \
              pg_isready -U matchdesk -d matchdesk > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T \
            -e CI=true -e "PGPASSWORD=$oidc_password" api \
            /app/.venv/bin/python - after-restart < e2e/oidc-login-psycopg.py \
            2>&1 | tee -a artifacts/integration/oidc-login-psycopg.log
      - name: Qualify encrypted workforce one-time OIDC state in disposable PostgreSQL
        id: workforce_oidc_storage
        if: ${{ !cancelled() && steps.oidc_storage.outcome == 'success' }}
        run: |
          set -euo pipefail
          node e2e/workforce-oidc-postgres.mjs 2>&1 | tee artifacts/integration/workforce-oidc-postgres.log
      - name: Qualify sealed pending workforce sessions and revoke in PostgreSQL
        id: workforce_pending_sessions
        if: ${{ !cancelled() && steps.workforce_oidc_storage.outcome == 'success' }}
        run: |
          set -euo pipefail
          node e2e/workforce-pending-session-postgres.mjs 2>&1 | tee artifacts/integration/workforce-pending-session-postgres.log
      - name: Qualify pending-bound step-up race and least-privilege PostgreSQL gates
        id: workforce_stepup_storage
        if: ${{ !cancelled() && steps.workforce_pending_sessions.outcome == 'success' }}
        run: |
          set -euo pipefail
          node e2e/workforce-step-up-postgres.mjs 2>&1 | tee artifacts/integration/workforce-step-up-postgres.log
      - name: Qualify SELECT-only customer directory with real PostgreSQL
        id: account_directory
        if: ${{ !cancelled() && steps.workforce_stepup_storage.outcome == 'success' }}
        run: |
          set -euo pipefail
          for attempt in 1 2; do
