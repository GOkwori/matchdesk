# Bootstrap only: resolve real registry metadata where a local resolver is unavailable.
# This job creates reviewable Git blobs, NEVER commits, refs, PRs or release approvals.
# Foundation CI remains the independent gate for accepting the eventual lockfiles.
name: Resolve dependency candidates
on:
  push:
    branches: [development]
    paths: ['.github/workflows/dependency-bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-candidates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    if: github.repository == 'GOkwori/matchdesk' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The sole write operation stores candidate blobs for subsequent review.
    # Checkout does not retain this credential, and package resolvers receive no token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, inspected 2026-10-08
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: Record tools and install the pinned resolver
        run: |
          set -euo pipefail
          python --version
          node --version
          npm --version
          python -m pip install --only-binary=:all: --index-url https://pypi.org/simple uv==0.10.0
          uv --version
      - name: Resolve Python dependencies without executing source builds
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv lock --python 3.12 --no-build
      - name: Resolve JavaScript dependencies without lifecycle scripts
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Validate candidate provenance and store review objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the two allowlisted lockfiles and a generated public manifest leave
          # this workspace. This script cannot update a branch or merge the draft PR.
          python - <<'PY'
          """Validate lock provenance, then store review candidates without publishing a commit."""
          import hashlib
          import json
          import os
          import platform
          import re
          import subprocess
          import tomllib
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          REPO = "GOkwori/matchdesk"
          API = f"https://api.github.com/repos/{REPO}/git/blobs"

          def store_blob(data: bytes) -> str:
              """Store only UTF-8 candidate data; verify GitHub's content-addressed reply."""
              payload = json.dumps({"content": data.decode("utf-8"), "encoding": "utf-8"}).encode()
              request = urllib.request.Request(API, data=payload, method="POST", headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  sha = json.load(response)["sha"]
              expected = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              if sha != expected:
                  raise ValueError("Git blob identity mismatch")
              return sha

          if os.environ["GITHUB_REPOSITORY"] != REPO or os.environ["GITHUB_REF"] != "refs/heads/development":
              raise ValueError("Candidate publication is restricted to the project development branch")
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != os.environ["GITHUB_SHA"]:
              raise ValueError("Source commit does not match workflow context")
          # The resolver must not silently edit reviewed package manifests.
          subprocess.run(["git", "diff", "--exit-code", "--", "pyproject.toml", "apps/web/package.json"], check=True)
          python_lock = tomllib.loads(Path("uv.lock").read_text())
          python_versions = {}
          for package in python_lock["package"]:
              source = package["source"]
              if source == {"virtual": "."} and package["name"] == "matchdesk":
                  continue
              if source.get("registry", "").rstrip("/") != "https://pypi.org/simple":
                  raise ValueError(f"Unexpected Python source for {package['name']}")
              artifacts = package.get("wheels", []) + ([package["sdist"]] if "sdist" in package else [])
              if not artifacts:
                  raise ValueError("A registry package has no hashed distributions")
              for artifact in artifacts:
                  url = urllib.parse.urlsplit(artifact["url"])
                  if url.scheme != "https" or url.hostname != "files.pythonhosted.org":
                      raise ValueError("Unexpected Python artifact host")
                  if not re.fullmatch(r"sha256:[0-9a-f]{64}", artifact["hash"]):
                      raise ValueError("Missing Python artifact integrity")
              python_versions[package["name"]] = package["version"]
          npm_lock = json.loads(Path("apps/web/package-lock.json").read_text())
          if npm_lock["lockfileVersion"] != 3:
              raise ValueError("Expected npm lockfile format 3")
          npm_versions = {}
          for name, package in npm_lock["packages"].items():
              if not name:
                  continue
              url = urllib.parse.urlsplit(package.get("resolved", ""))
              if url.scheme != "https" or url.hostname != "registry.npmjs.org" or package.get("link"):
                  raise ValueError(f"Unexpected npm package source: {name}")
              if not package.get("integrity", "").startswith("sha512-"):
                  raise ValueError(f"Missing npm integrity: {name}")
              npm_versions[name] = package["version"]
          manifest = {
              "schema_version": "1.0", "status": "CANDIDATE_NOT_QUALIFIED",
              "source_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "recorded_at": datetime.now(timezone.utc).isoformat(),
              "python": platform.python_version(),
              "node": subprocess.check_output(["node", "--version"], text=True).strip(),
              "npm": subprocess.check_output(["npm", "--version"], text=True).strip(),
              "uv": subprocess.check_output(["uv", "--version"], text=True).strip(),
              "python_packages": python_versions, "npm_packages": npm_versions,
              "files": [],
              "limitations": "Registry integrity/provenance checks only; not a vulnerability audit, application test or production approval.",
          }
          for name in ("uv.lock", "apps/web/package-lock.json"):
              path = Path(name)
              if path.is_symlink() or not path.is_file() or path.stat().st_size > 2_000_000:
                  raise ValueError("Invalid candidate path or size")
              data = path.read_bytes()
              manifest["files"].append({"path": name, "sha256": hashlib.sha256(data).hexdigest(), "size": len(data), "blob_sha": store_blob(data)})
          data = (json.dumps(manifest, indent=2, sort_keys=True) + "\n").encode()
          manifest_sha = store_blob(data)
          notice = json.dumps({"manifest_blob": manifest_sha, "source_commit": manifest["source_commit"], "files": manifest["files"]})
          print(f"::notice title=Dependency candidates::{notice}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Dependency candidates (not qualified)\n\n```json\n" + notice + "\n```\n")
          PY
