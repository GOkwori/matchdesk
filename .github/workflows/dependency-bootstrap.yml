# Temporary candidate generation: never updates a branch, merges or certifies a build.
name: Resolve dependency candidates
on:
  push:
    branches: [development]
    paths: ['.github/workflows/dependency-bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    if: github.repository == 'GOkwori/matchdesk' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Credentials are absent during package installation and formatting.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Install the pinned resolver
        run: |
          python -m pip install --only-binary=:all: uv==0.10.0
      - name: Resolve and install the corrected Python compatibility boundary
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: |
          set -euo pipefail
          uv lock --python 3.12 --no-build
          uv sync --locked --python 3.12 --no-build --group test --group quality
      - name: Resolve the compiler and declaration lock
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Reproduce the already-reviewed formatting patch
        run: |
          set -euo pipefail
          uv run --no-sync ruff check --select I --fix backend scripts
          uv run --no-sync ruff format backend scripts
      - name: Validate candidates and store content-addressed review objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          """Store allowlisted candidate files only; branch changes remain a separate review."""
          import hashlib
          import json
          import os
          import platform
          import re
          import subprocess
          import tomllib
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          REPO = "GOkwori/matchdesk"

          def store_blob(data: bytes) -> str:
              """Check the Git content identity returned for this UTF-8 candidate."""
              payload = json.dumps({"content": data.decode("utf-8"), "encoding": "utf-8"}).encode()
              request = urllib.request.Request(f"https://api.github.com/repos/{REPO}/git/blobs", data=payload, method="POST", headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json", "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  sha = json.load(response)["sha"]
              expected = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              if sha != expected:
                  raise ValueError("Git blob identity mismatch")
              return sha

          def trusted_url(value: str, host: str) -> bool:
              """Accept only a credential-free HTTPS distribution URL on the expected registry."""
              parsed = urllib.parse.urlsplit(value)
              return parsed.scheme == "https" and parsed.hostname == host and parsed.port in (None, 443) and parsed.username is None and parsed.password is None

          if os.environ["GITHUB_REPOSITORY"] != REPO or os.environ["GITHUB_REF"] != "refs/heads/development":
              raise ValueError("Unexpected repository or branch")
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != os.environ["GITHUB_SHA"]:
              raise ValueError("Unexpected source commit")
          review = json.loads(Path("docs/evidence/formatting-review-20261008.json").read_text())
          expected_files = review["files"]
          allowlist = {"uv.lock", "apps/web/package-lock.json", *expected_files}
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if not changed.issubset(allowlist):
              raise ValueError("Candidate generation changed an unreviewed file")
          for name, digest in expected_files.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != digest:
                  raise ValueError(f"Formatting differs from reviewed bytes: {name}")
          lock = tomllib.loads(Path("uv.lock").read_text())
          python_versions = {}
          for package in lock["package"]:
              source = package["source"]
              if source == {"virtual": "."} and package["name"] == "matchdesk":
                  continue
              if source.get("registry", "").rstrip("/") != "https://pypi.org/simple":
                  raise ValueError("Unexpected Python package source")
              artifacts = package.get("wheels", []) + ([package["sdist"]] if "sdist" in package else [])
              if not artifacts:
                  raise ValueError("Missing Python distributions")
              for artifact in artifacts:
                  if not trusted_url(artifact["url"], "files.pythonhosted.org") or not re.fullmatch(r"sha256:[0-9a-f]{64}", artifact["hash"]):
                      raise ValueError("Invalid Python distribution provenance")
              python_versions[package["name"]] = package["version"]
          if python_versions["anyio"] != "4.13.0":
              raise ValueError("The requested AnyIO constraint was not resolved")
          npm_lock = json.loads(Path("apps/web/package-lock.json").read_text())
          if npm_lock["lockfileVersion"] != 3:
              raise ValueError("Unexpected npm lock format")
          npm_versions = {}
          for name, package in npm_lock["packages"].items():
              if not name:
                  continue
              if not trusted_url(package.get("resolved", ""), "registry.npmjs.org") or package.get("link") or not package.get("integrity", "").startswith("sha512-"):
                  raise ValueError("Invalid npm distribution provenance")
              npm_versions[name] = package["version"]
          if npm_versions["node_modules/typescript"] != "6.0.3":
              raise ValueError("The requested compiler was not resolved")
          manifest = {
              "schema_version": "1.0", "status": "CANDIDATE_NOT_QUALIFIED",
              "source_commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "recorded_at": datetime.now(timezone.utc).isoformat(),
              "python": platform.python_version(), "python_packages": python_versions, "npm_packages": npm_versions,
              "node": subprocess.check_output(["node", "--version"], text=True).strip(),
              "npm": subprocess.check_output(["npm", "--version"], text=True).strip(),
              "uv": subprocess.check_output(["uv", "--version"], text=True).strip(),
              "files": [], "limitations": "Candidates only. Reproducible formatting and registry integrity do not replace tests, security audits or production approval.",
          }
          for name in sorted(allowlist):
              path = Path(name)
              if path.is_symlink() or not path.is_file() or path.stat().st_size > 2_000_000:
                  raise ValueError("Invalid candidate path")
              data = path.read_bytes()
              manifest["files"].append({"path": name, "size": len(data), "sha256": hashlib.sha256(data).hexdigest(), "blob_sha": store_blob(data)})
          manifest_sha = store_blob((json.dumps(manifest, indent=2, sort_keys=True) + "\n").encode())
          print(f"::notice title=Reviewed candidates::manifest_blob={manifest_sha}; source={os.environ['GITHUB_SHA']}")
          PY
