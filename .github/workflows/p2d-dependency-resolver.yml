name: P2D dependency resolver

on:
  push:
    branches:
      - development
    paths:
      - .github/workflows/p2d-dependency-resolver.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.15
          check-latest: false

      - name: Install pinned uv
        run: python -m pip install --only-binary=:all: uv==0.10.0

      - name: Resolve approved P2D dependencies
        run: |
          uv add --no-sync "agent-framework-foundry==1.14.1" "azure-identity==1.26.0"
          uv lock --check
          uv sync --locked --no-build --python 3.12 --group test --group quality
          git diff -- pyproject.toml uv.lock > p2d-lock.diff

      - name: Upload resolver-generated lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2d-resolved-python-lock
          path: |
            pyproject.toml
            uv.lock
            p2d-lock.diff
          if-no-files-found: error
          retention-days: 7
