name: P2D live Foundry smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  live-foundry-smoke:
    name: p2d-live-foundry-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AZURE_CORE_OUTPUT: none
      MATCHDESK_FOUNDRY_ENABLED: "true"
      FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_MODEL: ${{ secrets.FOUNDRY_MODEL }}
      PYTHONPATH: backend/src:.

    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up qualified Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.15"
          check-latest: false

      - name: Require explicit live qualification configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
          test -n "$FOUNDRY_PROJECT_ENDPOINT"
          test -n "$FOUNDRY_MODEL"

      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install the pinned package manager
        run: python -m pip install --only-binary=:all: uv==0.10.0

      - name: Synchronise exact reviewed dependencies
        run: uv sync --locked --no-build --python 3.12 --group test --group quality

      - name: Execute exactly one bounded Foundry specialist smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/p2d-live
          uv run --no-sync python scripts/p2d_live_foundry_smoke.py             | tee artifacts/p2d-live/evidence.json

      - name: Retain non-secret live qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2d-live-foundry-evidence
          path: artifacts/p2d-live/evidence.json
          if-no-files-found: error
          retention-days: 30
