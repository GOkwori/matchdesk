name: P2E live Foundry evaluation

# This file is registered on the default branch, so dispatching it against
# development runs development's copy. One confirmation value selects exactly one
# job; any other value runs nothing and calls no model.
#   RUN_P2E_LIVE_EVAL        one bounded live model evaluation (P2-05)
#   RUN_AGENT_WORKFLOW_LIVE  one bounded four-specialist run on the canonical match
on:
  workflow_dispatch:
    inputs:
      confirm_live_model_call:
        description: "Type RUN_P2E_LIVE_EVAL (one evaluation call) or RUN_AGENT_WORKFLOW_LIVE (one four-specialist run, about six model turns)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  live-foundry-evaluation:
    name: p2e-live-foundry-evaluation
    if: ${{ inputs.confirm_live_model_call == 'RUN_P2E_LIVE_EVAL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AZURE_CORE_OUTPUT: none
      MATCHDESK_FOUNDRY_ENABLED: "true"
      FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_MODEL: ${{ secrets.FOUNDRY_MODEL }}
      PYTHONPATH: backend/src:.

    steps:
      - name: Require explicit one-call cost authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_live_model_call }}" = "RUN_P2E_LIVE_EVAL"

      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up qualified Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.15"
          check-latest: false

      - name: Require live qualification configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$FOUNDRY_PROJECT_ENDPOINT"
          test -n "$FOUNDRY_MODEL"

      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install pinned package manager
        run: |
          python -m pip install --only-binary=:all: uv==0.10.0

      - name: Synchronise exact reviewed dependencies
        run: uv sync --locked --no-build --python 3.12 --group test --group quality

      - name: Execute exactly one bounded live model evaluation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/p2e-live
          uv run --no-sync python scripts/p2e_live_foundry_evaluation.py \
            | tee artifacts/p2e-live/evidence.json

      - name: Retain non-secret P2-05 evaluation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2e-live-foundry-evidence
          path: artifacts/p2e-live/evidence.json
          if-no-files-found: error
          retention-days: 30

  live-agent-run:
    name: record-live-agent-workflow
    if: ${{ inputs.confirm_live_model_call == 'RUN_AGENT_WORKFLOW_LIVE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AZURE_CORE_OUTPUT: none
      MATCHDESK_FOUNDRY_ENABLED: "true"
      FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_MODEL: ${{ secrets.FOUNDRY_MODEL }}
      PYTHONPATH: backend/src:.

    steps:
      - name: Require explicit cost authorization for one bounded run
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_live_model_call }}" = "RUN_AGENT_WORKFLOW_LIVE"

      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up qualified Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.15"
          check-latest: false

      - name: Require live qualification configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$FOUNDRY_PROJECT_ENDPOINT"
          test -n "$FOUNDRY_MODEL"

      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install pinned package manager
        run: |
          python -m pip install --only-binary=:all: uv==0.10.0

      - name: Synchronise exact reviewed dependencies
        run: uv sync --locked --no-build --python 3.12 --group test --group quality

      - name: Run the four-specialist workflow once on the canonical match
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/agent-run
          git rev-parse HEAD > artifacts/agent-run/source-commit.txt
          uv run --no-sync python -m scripts.record_agent_run --provider foundry \
            --out artifacts/agent-run/agent-trace.json | tee artifacts/agent-run/summary.txt

      - name: Re-verify every recorded verdict against the event log
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/agent-run/agent-trace.json apps/web/src/studio/generated/agent-trace.json
          uv run --no-sync python -m pytest backend/tests/test_agent_workflow.py -q -k committed_trace

      - name: Retain the non-secret trace for review and commit
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-run-trace
          path: artifacts/agent-run/
          if-no-files-found: error
          retention-days: 30
