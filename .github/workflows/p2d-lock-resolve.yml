# Temporary P2-04 dependency-lock resolver.
# This workflow never writes to the repository. It runs the repository's pinned uv
# resolver and uploads the generated uv.lock so the reviewed lock can be applied
# through the normal protected development/main workflow, then this file is removed.
name: P2D lock resolve

on:
  push:
    branches:
      - development
    paths:
      - pyproject.toml
      - .github/workflows/p2d-lock-resolve.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up qualified Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned uv
        run: python -m pip install --only-binary=:all: uv==0.10.0

      - name: Resolve lock from reviewed pyproject
        run: |
          uv lock --python 3.12
          git diff --check

      - name: Upload generated lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2d-generated-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 7
