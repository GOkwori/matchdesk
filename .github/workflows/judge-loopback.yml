# Dedicated real end-to-end loopback judge qualification, separate from Compose.
name: Judge loopback browser
on:
  pull_request:
    branches: [development]
    paths:
      - 'apps/web/src/app/api/judge-local/**'
      - 'apps/web/src/app/judge/**'
      - 'backend/src/matchdesk/api/judge_local_*.py'
      - 'backend/src/matchdesk/domain/judge_*.py'
      - 'e2e/specs/judge-workbench-connected.spec.mjs'
      - '.github/workflows/judge-loopback.yml'
permissions:
  contents: read
concurrency:
  group: judge-loopback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      MATCHDESK_LOCAL_JUDGE_ENABLED: '1'
      PYTHONPATH: backend/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Install exact locked dependencies and browser
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: uv==0.10.0
          uv sync --locked --no-build --python 3.12 --group test --group quality
          npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
          npm ci --prefix e2e --ignore-scripts --no-audit --no-fund
          (cd e2e && npx --no-install playwright install --with-deps chromium)
      - name: Exercise real browser to isolated Python judge host
        run: |
          set -euo pipefail
          mkdir -p artifacts/judge-loopback
          git rev-parse HEAD > artifacts/judge-loopback/source-commit.txt
          # Bind both servers to loopback, never Docker/public ingress.
          uv run --no-sync python -m matchdesk.api.judge_local_host > artifacts/judge-loopback/python-host.log 2>&1 &
          backend_pid=$!
          (cd apps/web && ./node_modules/.bin/next dev --hostname 127.0.0.1 --port 3000) > artifacts/judge-loopback/next-host.log 2>&1 &
          frontend_pid=$!
          cleanup() { kill "$frontend_pid" "$backend_pid" 2>/dev/null || true; wait "$frontend_pid" "$backend_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3000/judge > /dev/null 2>&1 && \
               test "$(curl --silent --max-time 2 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/api/judge/sessions)" = 405; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/judge > /dev/null
          # Backend GET of POST-only endpoint must be denied, not exposed.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/api/judge/sessions)" = 405
          (cd e2e && npx --no-install playwright test specs/judge-workbench-connected.spec.mjs --project=desktop --reporter=line) \
            2>&1 | tee artifacts/judge-loopback/browser.log
          # A green browser qualification must retain both synthetic evidence views.
          test -s artifacts/judge-loopback/synthetic-judge-view.png
          test -s artifacts/judge-loopback/synthetic-judge-reset.png
      - name: Retain sanitized qualification artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: judge-loopback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/judge-loopback/source-commit.txt
            artifacts/judge-loopback/browser.log
            artifacts/judge-loopback/synthetic-judge-view.png
            artifacts/judge-loopback/synthetic-judge-reset.png
          if-no-files-found: error
          retention-days: 30
