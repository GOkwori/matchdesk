# Temporary resolver. Candidate generation cannot merge, deploy or change a branch.
# A separate clean job stores only allowlisted text blobs for explicit review.
name: Resolve patched Python candidates
on:
  push:
    branches: [development]
    paths: ['.github/workflows/security-dependency-candidates.yml']
permissions:
  contents: read
jobs:
  resolve:
    if: github.repository == 'GOkwori/matchdesk' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - name: Prepare narrowly scoped patched constraints
        run: |
          python - <<'PY'
          """Replace only the vulnerable dependency boundaries, preserving all quality rules."""
          from pathlib import Path
          path = Path('pyproject.toml')
          text = path.read_text()
          changes = {
              '"fastapi==0.128.2"': '"fastapi==0.142.4"',
              '"pytest==9.0.2"': '"pytest==9.0.3"',
              '# Starlette 0.50.0 imports an alias deprecated by AnyIO 4.15.1. Keep the compatible\n# boundary explicit until the FastAPI/Starlette upgrade is regression-qualified.\n# Do not hide this dependency mismatch by suppressing DeprecationWarning in pytest.\nconstraint-dependencies = ["anyio==4.13.0"]':
              '# Patched ASGI dependency boundaries are resolved within FastAPI metadata, not\n# forced with overrides. ADR-0007 records the audit and regression qualification.\nconstraint-dependencies = ["starlette==1.7.0", "anyio==4.15.1"]',
          }
          for before, after in changes.items():
              if text.count(before) != 1:
                  raise ValueError('Source changed; do not apply an ambiguous dependency patch')
              text = text.replace(before, after)
          path.write_text(text)
          PY
      - name: Generate and install the actual compatible lock
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --index-url https://pypi.org/simple uv==0.10.0
          uv lock --python 3.12 --no-build
          uv sync --locked --no-build --python 3.12 --group test --group quality
          uv pip check
      - name: Retain validated candidates and upstream metadata
        run: |
          python - <<'PY'
          """Record package metadata, exact bytes and source identity without executing packages."""
          import hashlib
          import json
          import os
          import re
          import shutil
          import tomllib
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path('artifacts/patched-python-candidates')
          root.mkdir(parents=True)
          lock = tomllib.loads(Path('uv.lock').read_text())
          versions = {}
          for package in lock['package']:
              if package['name'] == 'matchdesk' and package['source'] == {'virtual': '.'}:
                  continue
              if package['source'].get('registry', '').rstrip('/') != 'https://pypi.org/simple':
                  raise ValueError('Unexpected package index')
              distributions = package.get('wheels', []) + ([package['sdist']] if 'sdist' in package else [])
              if not distributions:
                  raise ValueError('No distributions in package lock')
              for artifact in distributions:
                  url = urlsplit(artifact['url'])
                  if url.scheme != 'https' or url.hostname != 'files.pythonhosted.org' or url.username or url.password:
                      raise ValueError('Unapproved artifact origin')
                  if not re.fullmatch(r'sha256:[0-9a-f]{64}', artifact['hash']):
                      raise ValueError('Missing distribution integrity')
              versions[package['name']] = package['version']
          expected = {'fastapi': '0.142.4', 'starlette': '1.7.0', 'anyio': '4.15.1', 'pytest': '9.0.3'}
          metadata = {}
          for name, version in expected.items():
              if versions[name] != version:
                  raise ValueError('The patched constraint was not resolved')
              with urllib.request.urlopen(f'https://pypi.org/pypi/{name}/{version}/json', timeout=30) as response:
                  document = json.load(response)
              if document['info']['version'] != version or not document['urls'] or any(item['yanked'] for item in document['urls']):
                  raise ValueError('Missing, mismatched or yanked upstream release')
              metadata[name] = {'version': version, 'requires_python': document['info']['requires_python'], 'requires_dist': document['info']['requires_dist']}
          files = {}
          for name in ('pyproject.toml', 'uv.lock'):
              data = Path(name).read_bytes()
              files[name] = {'sha256': hashlib.sha256(data).hexdigest(), 'size': len(data)}
              shutil.copyfile(name, root / name)
          report = {
              'status': 'CANDIDATE_NOT_QUALIFIED', 'source_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'recorded_at': datetime.now(timezone.utc).isoformat(), 'files': files,
              'resolved_versions': versions, 'upstream_metadata': metadata,
              'limitations': 'Resolver and package-metadata compatibility only; independent tests and advisory scans remain mandatory.'
          }
          (root / 'manifest.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patched-python-candidates-${{ github.run_id }}
          path: artifacts/patched-python-candidates/
          if-no-files-found: error
          retention-days: 60
  review-objects:
    # No checkout or dependency execution in this write-capable job. It accepts data
    # from this run only and creates Git objects, never commits, refs or approvals.
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: patched-python-candidates-${{ github.run_id }}
          path: candidates
      - name: Store integrity-checked allowlisted objects for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          """Create only reviewed-path candidate blobs; leave branch publication to a separate review."""
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          root = Path('candidates')
          allowed = {'pyproject.toml', 'uv.lock', 'manifest.json'}
          if {p.name for p in root.iterdir()} != allowed:
              raise ValueError('Unexpected candidate files')
          report = json.loads((root / 'manifest.json').read_text())
          if report['source_commit'] != os.environ['GITHUB_SHA'] or report['run_id'] != os.environ['GITHUB_RUN_ID']:
              raise ValueError('Unexpected source/run binding')
          if os.environ['GITHUB_REPOSITORY'] != 'GOkwori/matchdesk' or os.environ['GITHUB_REF'] != 'refs/heads/development':
              raise ValueError('Unexpected publication scope')
          blobs = {}
          for name in sorted(allowed):
              path = root / name
              if path.is_symlink() or not path.is_file() or path.stat().st_size > 2_000_000:
                  raise ValueError('Invalid candidate file')
              data = path.read_bytes()
              if name != 'manifest.json' and hashlib.sha256(data).hexdigest() != report['files'][name]['sha256']:
                  raise ValueError('Candidate integrity mismatch')
              request = urllib.request.Request('https://api.github.com/repos/GOkwori/matchdesk/git/blobs', method='POST',
                  data=json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  sha = json.load(response)['sha']
              if sha != hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest():
                  raise ValueError('Git object identity mismatch')
              blobs[name] = sha
          print('::notice title=Patched Python candidates::' + json.dumps(blobs, sort_keys=True))
          PY
