# Temporary resolver: the newer Starlette TestClient requires HTTPX2.
# Package resolution has read-only access; a separate clean job stores review blobs.
name: Resolve supported test client
on:
  push:
    branches: [development]
    paths: ['.github/workflows/httpx2-candidate.yml']
permissions:
  contents: read
jobs:
  resolve:
    if: github.repository == 'GOkwori/matchdesk' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - name: Replace only the test-client dependency
        run: |
          python - <<'PY'
          """Use the upstream-supported client without weakening warning or assertion gates."""
          from pathlib import Path
          path = Path('pyproject.toml')
          text = path.read_text()
          before = '"httpx==0.28.1"'
          if text.count(before) != 1:
              raise ValueError('Unexpected test dependency; review before changing it')
          path.write_text(text.replace(before, '"httpx2==2.13.1"'))
          PY
      - name: Resolve, install and check the real package graph
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --index-url https://pypi.org/simple uv==0.10.0
          uv lock --python 3.12 --no-build
          uv sync --locked --no-build --python 3.12 --group test --group quality
          uv pip check
          # Promote no candidate that still raises a deprecation on TestClient import.
          uv run --no-sync python -W error -c 'from starlette.testclient import TestClient; import httpx2; assert issubclass(TestClient, httpx2.Client)'
      - name: Record candidate bytes and trusted registry provenance
        run: |
          python - <<'PY'
          """Capture a source-bound candidate; these are not independent application-test results."""
          import hashlib
          import json
          import os
          import re
          import tomllib
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit
          root = Path('artifacts/test-client-candidate')
          root.mkdir(parents=True)
          lock = tomllib.loads(Path('uv.lock').read_text())
          versions = {}
          for package in lock['package']:
              if package['name'] == 'matchdesk' and package['source'] == {'virtual': '.'}:
                  continue
              if package['source'].get('registry', '').rstrip('/') != 'https://pypi.org/simple':
                  raise ValueError('Unexpected registry')
              distributions = package.get('wheels', []) + ([package['sdist']] if 'sdist' in package else [])
              if not distributions:
                  raise ValueError('Unhashed distribution')
              for artifact in distributions:
                  url = urlsplit(artifact['url'])
                  if url.scheme != 'https' or url.hostname != 'files.pythonhosted.org' or url.username or url.password:
                      raise ValueError('Unexpected distribution host')
                  if not re.fullmatch(r'sha256:[0-9a-f]{64}', artifact['hash']):
                      raise ValueError('Missing distribution integrity')
              versions[package['name']] = package['version']
          if versions.get('httpx2') != '2.13.1' or 'httpx' in versions:
              raise ValueError('The supported client replacement did not resolve')
          report = {
              'source_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'recorded_at': datetime.now(timezone.utc).isoformat(),
              'status': 'CANDIDATE_NOT_QUALIFIED', 'resolved_versions': versions, 'files': {},
              'limitations': 'Package resolution and warning-free client import only. Tests, containers and audits must qualify the committed candidate.'
          }
          for name in ('pyproject.toml', 'uv.lock'):
              data = Path(name).read_bytes()
              (root / name).write_bytes(data)
              report['files'][name] = {'sha256': hashlib.sha256(data).hexdigest(), 'size': len(data)}
          (root / 'manifest.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-client-candidate-${{ github.run_id }}
          path: artifacts/test-client-candidate/
          if-no-files-found: error
          retention-days: 60
  review-objects:
    # This job has no checkout, package install or execution of candidate code.
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: test-client-candidate-${{ github.run_id }}
          path: candidates
      - name: Store only integrity-checked text objects, never branch updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          """Create allowlisted Git objects for a separate review and non-forced publication."""
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path
          root = Path('candidates')
          allowed = {'pyproject.toml', 'uv.lock', 'manifest.json'}
          if {p.name for p in root.iterdir()} != allowed:
              raise ValueError('Unexpected files')
          report = json.loads((root / 'manifest.json').read_text())
          if report['source_commit'] != os.environ['GITHUB_SHA'] or report['run_id'] != os.environ['GITHUB_RUN_ID']:
              raise ValueError('Source binding mismatch')
          if os.environ['GITHUB_REPOSITORY'] != 'GOkwori/matchdesk' or os.environ['GITHUB_REF'] != 'refs/heads/development':
              raise ValueError('Repository binding mismatch')
          blobs = {}
          for name in sorted(allowed):
              path = root / name
              if path.is_symlink() or not path.is_file() or path.stat().st_size > 2_000_000:
                  raise ValueError('Invalid candidate path')
              data = path.read_bytes()
              if name != 'manifest.json' and hashlib.sha256(data).hexdigest() != report['files'][name]['sha256']:
                  raise ValueError('Candidate digest mismatch')
              request = urllib.request.Request('https://api.github.com/repos/GOkwori/matchdesk/git/blobs', method='POST',
                  data=json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  sha = json.load(response)['sha']
              if sha != hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest():
                  raise ValueError('Git object mismatch')
              blobs[name] = sha
          print('::notice title=Supported test client::' + json.dumps(blobs, sort_keys=True))
          PY
