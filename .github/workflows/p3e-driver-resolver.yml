# One-shot, read-only dependency resolution proof for P3-05.
# Generated files remain suggestions; only a separate reviewed commit may adopt them.
name: Resolve P3E PostgreSQL driver lock
on:
  push:
    branches: [development]
    paths: ['.github/workflows/p3e-driver-resolver.yml']
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - name: Install exact approved resolver
        run: "python -m pip install --only-binary=:all: uv==0.10.0"
      - name: Resolve exact Psycopg dependency without repository write authority
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("pyproject.toml")
          original = path.read_text()
          old = '    "pydantic==2.13.5",\n'
          assert original.count(old) == 1
          assert 'psycopg' not in original
          path.write_text(original.replace(old, old + '    "psycopg[binary]==3.3.6",\n'))
          PY
          uv lock --python 3.12 --no-build
      - name: Independently inspect preserved dependency graph and emit exact review patch
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import subprocess
          import tomllib
          from pathlib import Path
          old = tomllib.loads(subprocess.check_output(["git", "show", "HEAD:uv.lock"], text=True))
          new = tomllib.loads(Path("uv.lock").read_text())
          def identities(lock):
              return {p["name"]: p["version"] for p in lock["package"]}
          earlier = identities(old)
          latest = identities(new)
          existing_changes = {n: (v, latest.get(n)) for n, v in earlier.items() if latest.get(n) != v}
          if existing_changes:
              raise RuntimeError("Unrelated dependency versions changed: " + repr(existing_changes))
          assert latest.get("psycopg") == "3.3.6"
          assert latest.get("psycopg-binary") == "3.3.6"
          manifest = Path("pyproject.toml").read_text()
          assert manifest.count('"psycopg[binary]==3.3.6"') == 1
          changes = subprocess.run(
              ["git", "diff", "--", "pyproject.toml", "uv.lock"],
              text=True, capture_output=True, check=True,
          ).stdout
          if not changes or len(changes) > 120000:
              raise RuntimeError("Unexpected generated diff size")
          print("MATCHDESK_RESOLVER_PATCH_START")
          for line in changes.splitlines():
              print("MATCHDESK_PATCH|" + line)
          print("MATCHDESK_RESOLVER_PATCH_END")
          for filename in ("pyproject.toml", "uv.lock"):
              content = Path(filename).read_bytes()
              print("MATCHDESK_FILE|" + filename + "|bytes=" + str(len(content)) + "|sha256=" + hashlib.sha256(content).hexdigest())
          print("MATCHDESK_PACKAGE_VERSIONS|" + repr({name: latest[name] for name in sorted(latest.keys() - earlier.keys())}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p3e-driver-lock-suggestion
          path: |
            pyproject.toml
            uv.lock
          if-no-files-found: error
          retention-days: 14
