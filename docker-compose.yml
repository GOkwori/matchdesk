# Local foundation runtime. Healthy containers do not certify the full product.
name: matchdesk
services:
  postgres:
    build:
      context: .
      dockerfile: backend/postgres/Dockerfile
    environment:
      POSTGRES_USER: matchdesk
      POSTGRES_DB: matchdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python -m scripts.create_local_env first}
      # initdb otherwise permits trusted loopback TCP in addition to its local socket.
      # These settings apply to new data directories, not existing database volumes.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchdesk -d matchdesk"]
      interval: 5s
      timeout: 3s
      retries: 15
    # No host port. Password-based TCP and durability are tested separately.
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Liveness is intentionally separate from product readiness (503).
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        MATCHDESK_API_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
